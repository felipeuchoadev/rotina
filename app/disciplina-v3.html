<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0a0d">
<link rel="manifest" href="manifest.json?v=139">
<link rel="icon" href="favicon.ico?v=139" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-rz.png?v=139">
<link rel="shortcut icon" href="favicon.ico?v=139">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png?v=139">
<title>REDZONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TEMA / VARIÁVEIS  (o tema troca --bg,--bg2,--accent,--accent2)
============================================================ */
:root{
  --bg:#0e1013; --bg2:#0e1013; --surface:#171a20; --surface2:#1d212a;
  --accent:#ff4b4b; --accent2:#ff6b6b; --text:#f3f5f8; --text-dim:#98a1ae;
  --line:rgba(255,255,255,.07); --ok:#37d67a; --warn:#ffb300; --danger:#ff5a5a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; overflow-x:clip;}
html.modal-open,body.modal-open{overflow:hidden!important;overscroll-behavior:none;}
/* html pega a cor do tema pra NUNCA aparecer branco por trás (overscroll/teclado no celular) */
html{background:var(--bg2);}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);
  background:
    radial-gradient(120% 55% at 50% 0, color-mix(in srgb,var(--accent) 12%, transparent), transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  /* fixo na viewport: o topo é SEMPRE var(--bg), então a topbar (sticky) casa com o fundo ao rolar
     (sem isso, o gradiente rolava e a topbar virava um "quadrado" de cor diferente).
     A faixa branca no mobile já é evitada pelo html{background:var(--bg2)} acima (fallback escuro). */
  background-attachment:fixed;
  background-color:var(--bg2);
  min-height:100vh; min-height:100dvh; font-size:16.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  /* A interface é um app, não uma página de texto: evita seleção acidental e
     a pesquisa do Android ao segurar títulos, botões, cartões ou navegação. */
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
/* Conteúdo que pode ser digitado ou copiado continua selecionável. */
input,textarea,select,[contenteditable="true"],.post-body,.comment-text,.profile-bio{
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
}
.display{font-family:'Inter',sans-serif; font-weight:800; letter-spacing:-.01em;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
h1,h2,h3,h4{font-family:'Inter',system-ui,sans-serif; font-weight:800; letter-spacing:-.01em; margin:0; color:var(--text);}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:16px;}
.pwwrap{position:relative; display:block;}
.pwwrap input{padding-right:46px !important; width:100%;}
.eyebtn{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:#fff; font-size:20px; line-height:1; opacity:.92; padding:8px; cursor:pointer; filter:drop-shadow(0 1px 2px #000);}
.eyebtn:hover{opacity:1;}
img{max-width:100%;-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none;}
a{color:var(--accent2);}

/* ============================================================
   ESTRUTURA GERAL — Modelo C "Atleta"
============================================================ */
#app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:32px;}
.screen{display:none; padding:0 16px;}
.screen.active{display:block; animation:fade .2s ease;}
@keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

/* Topo neutro (todas as páginas menos Início) */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 4px 12px; position:sticky; top:0; z-index:20;
  /* Um único fundo contínuo em toda a viewport. Qualquer camada/blur só na largura
     central do app cria uma emenda vertical visível nos temas e telas largas. */
  background:transparent; isolation:isolate;
  backdrop-filter:none; -webkit-backdrop-filter:none;
  box-shadow:0 1px 0 var(--line);
}
.topbar::before{content:'';position:absolute;z-index:-1;inset:0 auto 0 50%;width:100vw;transform:translateX(-50%);background:var(--bg);}
.topbar>div{min-width:0}.topbar>div:first-child{flex:1}.topbar .brand{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.topbar .homeclock{flex:0 0 auto;min-width:0}
.brand{font-weight:800; font-size:20px; letter-spacing:-.01em;}
.brand .dot{color:var(--accent);}
.home-logo{height:72px; width:72px; object-fit:cover; border-radius:16px; filter:drop-shadow(0 6px 18px color-mix(in srgb,var(--accent) 50%, transparent));}
.clock{font-weight:700; font-size:16px; color:var(--text-dim); font-variant-numeric:tabular-nums; text-align:right; line-height:1;}
.clock small{color:var(--text-dim); font-size:11px; margin-left:3px; font-weight:600;}

/* Cabeçalho do Início — hero card com anel de progresso */
.home-top{padding:16px 4px 4px;}
.home-topline{display:flex; align-items:center; justify-content:space-between; gap:12px;}
/* Relógio + data integrados (só no Início) */
.homeclock{text-align:right; line-height:1;}
.homeclock .hc-time{font-weight:800; font-size:26px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--text); line-height:1;}
.homeclock .hc-time small{font-size:12px; font-weight:700; color:var(--accent2); margin-left:3px; vertical-align:top;}
.homeclock .hc-date{font-size:11.5px; font-weight:700; color:var(--text-dim); text-transform:capitalize; margin-top:4px; letter-spacing:.01em;}
.herocard{position:relative; display:flex; gap:16px; align-items:center; background:linear-gradient(150deg,var(--surface2),var(--surface)); border-radius:22px; padding:18px; margin-top:12px; border:1px solid var(--line); box-shadow:0 16px 36px -18px rgba(0,0,0,.7); overflow:hidden;}
.herocard::before{content:''; position:absolute; top:-40%; right:-15%; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb,var(--accent) 26%, transparent), transparent 70%); pointer-events:none;}
.herocard::after{content:''; position:absolute; left:0; right:0; top:0; height:1px; background:linear-gradient(90deg, transparent, color-mix(in srgb,var(--accent) 55%, transparent), transparent);}
.ring{position:relative; z-index:1; width:86px; height:86px; flex:0 0 86px; border-radius:50%; display:grid; place-items:center; box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%, transparent), 0 10px 26px -12px color-mix(in srgb,var(--accent) 70%, transparent);}
.ring .ring-inner{width:72px; height:72px; border-radius:50%; overflow:hidden; background:var(--surface); display:grid; place-items:center; font-weight:800; font-size:27px;}
.ring .ring-inner img{width:100%; height:100%; object-fit:cover;}
.herocard>div:last-child{position:relative; z-index:1;}
.hero-name{font-weight:800; font-size:23px; line-height:1; letter-spacing:-.01em;}
.hero-user{color:var(--text-dim); font-size:13px; margin-top:5px;}
.pill{display:inline-flex; align-items:center; gap:6px; margin-top:11px; background:color-mix(in srgb,var(--accent) 18%, transparent); color:var(--accent2); font-size:12px; font-weight:800; padding:6px 13px; border-radius:999px; border:1px solid color-mix(in srgb,var(--accent) 30%, transparent);}
.biorow{display:flex; gap:10px; margin:16px 0 4px;}
.biocard{flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:15px 8px; text-align:center;}
.biocard b{font-size:19px; font-weight:800; display:block; line-height:1.15; margin-bottom:4px;}
.biocard s{font-size:10px; text-decoration:none; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; line-height:1.2;}

/* Avatar (ranking / feed / perfil) */
.avatar{width:84px; height:84px; border-radius:20px; object-fit:cover; flex:0 0 84px; background:var(--surface2);}
.avatar.sm{width:46px; height:46px; border-radius:13px; flex-basis:46px;}
.avatar.xs{width:40px; height:40px; border-radius:12px; flex-basis:40px;}
.profile-photo-button{border:0;padding:0;background:transparent;color:inherit;cursor:pointer;display:flex;border-radius:22px;flex:0 0 auto;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;}
.profile-photo-button:focus-visible{outline:3px solid var(--accent);outline-offset:4px;}
.photo-viewer{min-height:min(72vh,680px);display:flex;align-items:center;justify-content:center;padding:16px 0 4px;}
.photo-viewer img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;object-fit:contain;border-radius:18px;background:var(--surface2);box-shadow:0 18px 60px rgba(0,0,0,.5);}

/* Patente / insígnia (perfil) */
.patente-row{display:flex; align-items:center; gap:14px; margin:14px 0 4px; padding:16px; border-radius:20px;
  background:linear-gradient(150deg,var(--surface2),var(--surface)); border:1px solid var(--line); box-shadow:0 14px 32px -20px rgba(0,0,0,.6);}
.insignia{width:38px; height:68px; flex:0 0 38px;}
.insignia.sm{width:23px; height:41px; flex-basis:23px;}
.patente-name{font-weight:800; font-size:19px; color:var(--text);}
.xpbar{height:8px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; margin-top:9px;}
.xpbar>i{display:block; height:100%; border-radius:99px; background:var(--ok);}
.xp-label{font-size:12.5px; color:var(--text-dim); margin-top:7px;}

/* Cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin:12px 0; box-shadow:0 12px 28px -22px rgba(0,0,0,.6);}
.card h2{font-weight:800; font-size:18px;}
.section-title{font-weight:800; font-size:15px; color:var(--text); margin:24px 2px 14px; letter-spacing:.01em;line-height:1.35}
.card .h{font-size:12.5px; color:var(--text-dim); font-weight:700; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
.muted{color:var(--text-dim);}
.small{font-size:14px;}

/* Cards de resumo do Início (com ícone + progresso) */
.sumgrid{display:grid; gap:10px;}
.sumcard{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 15px;}
.sumcard .ic{width:40px; height:40px; flex:0 0 40px; border-radius:13px; background:color-mix(in srgb,var(--accent) 12%, transparent); display:grid; place-items:center;}
.sumcard .ic svg{width:20px; height:20px; stroke:var(--accent); fill:none; stroke-width:1.9;}
.sumcard .g{flex:1; min-width:0;}
.sumcard .g .t{font-size:12px; color:var(--text-dim); line-height:1.2;}
.sumcard .g .v{font-weight:800; font-size:16px; line-height:1.3; margin-top:2px;}
.sumcard .prog{width:52px; height:6px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; flex:0 0 52px;}
.sumcard .prog i{display:block; height:100%; background:var(--ok);}

/* Botões */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px;
  padding:15px 18px; font-weight:700; font-size:15.5px; letter-spacing:.01em;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; width:100%;
  box-shadow:0 12px 26px -14px color-mix(in srgb,var(--accent) 75%, transparent);}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent; border:1.5px solid var(--line); color:var(--text); box-shadow:none;}
.btn.sm{width:auto; padding:9px 15px; font-size:13px; border-radius:11px;}
.btn.ok{background:linear-gradient(135deg,#1f9e57,var(--ok)); box-shadow:none;}
.btn:disabled{opacity:.45;}

/* Controle de água: o input pode encolher e os botões nunca escapam do card. */
.agua-ajuste{display:grid; grid-template-columns:minmax(0,1fr) 54px 54px; gap:8px; align-items:stretch;}
.agua-ajuste input{width:100%; min-width:0; background:var(--surface2); border:1.5px solid var(--line); border-radius:12px; padding:12px; color:var(--text);}
.agua-ajuste .btn{width:54px; min-width:54px; height:52px; padding:0; font-size:22px;}
.agua-acoes{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; margin-top:8px;}
.agua-acoes .btn{width:100%; min-width:0; padding-left:8px; padding-right:8px; white-space:nowrap;}

/* Inputs */
.field{margin:14px 0;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px; font-weight:700;}
.field input, .field textarea, .field select{
  width:100%; background:var(--surface2); border:1.5px solid var(--line); border-radius:14px;
  padding:14px; color:var(--text); outline:none;}
.field input:focus, .field textarea:focus{border-color:var(--accent);}
textarea.auto{resize:none; overflow:hidden; min-height:48px;}
.err{color:var(--danger); font-size:13.5px; margin-top:6px; min-height:1px;}

/* Planilha / linhas com check */
.rowitem{display:flex; align-items:center; gap:13px; padding:14px; border:1px solid var(--line); border-radius:16px; margin:10px 0; background:var(--surface); color:var(--text); line-height:1.4;}
button.rowitem{width:100%;text-align:left;font:inherit}
.rowitem .chk{width:30px; height:30px; border-radius:10px; border:2px solid var(--line); flex:0 0 30px; display:flex; align-items:center; justify-content:center; font-size:17px; color:#fff;}
.rowitem.done{border-color:var(--ok); background:color-mix(in srgb,var(--ok) 8%, var(--surface));}
.rowitem.done .chk{background:var(--ok); border-color:var(--ok);}
.rowitem .txt{flex:1; min-width:0;}
.rowitem .txt .t{font-weight:700; font-size:15.5px; color:var(--text); line-height:1.35;}
.rowitem .txt .s{font-size:13px; color:var(--text-dim); line-height:1.45; margin-top:3px;}
.rotina-drag{flex:0 0 36px;width:36px;height:38px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--text-dim);font-size:20px;cursor:grab;touch-action:none;user-select:none}
.rotina-drag:active{cursor:grabbing;color:var(--accent2);border-color:var(--accent)}
.rotina-ordering{opacity:.72;outline:2px solid var(--accent);outline-offset:2px}
.rotina-batch-list{display:grid;gap:10px;margin:10px 0}
.rotina-batch-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,.35fr) 40px;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}
.rotina-batch-item textarea{grid-column:1/-1;min-height:58px;resize:vertical}
@media(max-width:520px){.rotina-batch-item{grid-template-columns:minmax(0,1fr) 40px}.rotina-batch-item .batch-hora{grid-column:1}.rotina-batch-item textarea{grid-column:1/-1}}
.rotina-clear-summary{padding:12px 14px;border:1px solid rgba(255,90,90,.28);border-radius:15px;background:rgba(255,90,90,.08);line-height:1.45}
.rotina-clear-day{margin-top:12px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface2)}
.rotina-clear-day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rotina-clear-day-head label{display:flex;align-items:center;gap:8px;font-weight:800;cursor:pointer}
.rotina-clear-day-head input,.rotina-clear-item input{width:21px;height:21px;accent-color:var(--danger);flex:0 0 auto}
.rotina-clear-items{display:grid}.rotina-clear-item{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;cursor:pointer}.rotina-clear-item+.rotina-clear-item{border-top:1px solid var(--line)}
.rotina-clear-item span{min-width:0}.rotina-clear-item b{display:block;overflow-wrap:anywhere}.rotina-clear-item small{display:block;color:var(--text-dim);margin-top:2px}
.btn.danger-outline{background:transparent!important;border-color:rgba(255,90,90,.55);color:var(--danger);box-shadow:none}
.materia-editor-list{display:grid;gap:10px;margin:10px 0 12px}
.materia-editor-item{display:grid;gap:8px;padding:11px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}
.materia-editor-row{display:flex;align-items:flex-start;gap:9px;min-width:0}
.materia-editor-num{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent2);font-weight:800;font-size:13px}
.materia-editor-item textarea{flex:1;min-width:0;min-height:52px;max-height:180px;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:12px;font:inherit;line-height:1.4;overflow-y:auto}
.materia-editor-item textarea:focus{outline:none;border-color:var(--accent)}
.materia-editor-add-sub{justify-self:start;margin-left:39px;border:0;background:transparent;color:var(--accent2);font:inherit;font-size:12.5px;font-weight:800;padding:5px 8px;border-radius:9px}
.materia-editor-add-sub:hover,.materia-editor-add-sub:focus-visible{background:color-mix(in srgb,var(--accent) 12%,transparent);outline:none}
.materia-editor-remove{flex:0 0 38px;width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--text-dim);font-size:17px}
.materia-editor-remove:active{border-color:var(--danger);color:var(--danger)}
.materia-content-name{white-space:pre-line;overflow-wrap:anywhere}
.study-tree{display:grid;gap:11px}
.study-tree-materia{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.study-tree-head,.study-tree-group-head{display:flex;align-items:center;gap:11px;width:100%;border:0;color:var(--text);text-align:left;font:inherit}
.study-tree-head{padding:15px;background:transparent}
.study-tree-head .txt,.study-tree-group-head .txt{flex:1;min-width:0}
.study-tree-head .t,.study-tree-group-head .t{display:block;font-weight:800;font-size:15.5px;line-height:1.35}
.study-tree-head .s,.study-tree-group-head .s{display:block;color:var(--text-dim);font-size:12.5px;line-height:1.4;margin-top:3px}
.study-tree-head .xpbar{display:block;margin-top:7px}
.study-tree-caret{display:grid;place-items:center;width:28px;height:28px;color:var(--text-dim);font-size:20px;transition:transform .18s ease}
.study-tree-materia.open>.study-tree-head .study-tree-caret,.study-tree-group.open>.study-tree-group-head .study-tree-caret{transform:rotate(90deg)}
.study-tree-body{display:none;padding:0 11px 11px}
.study-tree-materia.open>.study-tree-body{display:grid;gap:8px}
.study-tree-group{border:1px solid var(--line);border-radius:14px;background:var(--surface2);overflow:hidden}
.study-tree-group-head{padding:12px;background:transparent}
.study-tree-folder{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--accent) 15%,transparent);font-size:17px}
.study-tree-contents{display:none;border-top:1px solid var(--line)}
.study-tree-group.open>.study-tree-contents{display:block}
.study-tree-content{display:flex;align-items:flex-start;gap:10px;padding:12px 13px 12px 25px;border-top:1px solid var(--line)}
.study-tree-content:first-child{border-top:0}
.study-tree-content .dot{flex:0 0 12px;width:12px;height:12px;margin-top:5px;border:2px solid var(--text-dim);border-radius:50%}
.study-tree-content.done .dot{background:var(--ok);border-color:var(--ok)}
.study-tree-content.done .materia-content-name{opacity:.68}
.study-tree-node{border-top:1px solid var(--line)}
.study-tree-node:first-child{border-top:0}
.study-tree-node-row{display:flex;align-items:flex-start;gap:7px;padding:10px 10px 10px calc(12px + min(var(--tree-depth,0),4) * 18px)}
.study-tree-node-main{display:flex;align-items:flex-start;gap:9px;flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;text-align:left;padding:2px 0}
.study-tree-node-main .txt{flex:1;min-width:0}
.study-tree-node-main .t{font-weight:700;font-size:14px;line-height:1.4}
.study-tree-node-main .s{font-size:12px;color:var(--text-dim);margin-top:3px}
.study-tree-node-main .dot{flex:0 0 12px;width:12px;height:12px;margin-top:4px;border:2px solid var(--text-dim);border-radius:50%}
.study-tree-node-caret,.study-tree-node-caret-spacer{display:grid;place-items:center;flex:0 0 28px;width:28px;height:34px}
.study-tree-node-caret{border:0;background:transparent;color:var(--text-dim);font-size:20px;transition:transform .18s ease}
.study-tree-node.open>.study-tree-node-row>.study-tree-node-caret{transform:rotate(90deg)}
.study-tree-node-children{display:none;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 45%,transparent)}
.study-tree-node.open>.study-tree-node-children{display:block}
.study-tree-node.done>.study-tree-node-row .dot{background:var(--ok);border-color:var(--ok)}
.study-tree-node.done>.study-tree-node-row .materia-content-name{opacity:.68}

.weeks-block-title{display:flex;align-items:center;gap:9px;margin:16px 3px 7px;color:var(--text-dim);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}

/* Bottom nav (7 itens) */

.hamb{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:11px; border:1px solid var(--line); background:var(--surface2); color:var(--text); font-size:19px; flex:0 0 40px; cursor:pointer;}

.backbtn{font-size:26px !important; display:inline-flex !important; line-height:1;}
/* seta de voltar — acompanha o tema (cor do texto, realce no hover com a cor do tema) */
.backbtn{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:11px; border:1px solid var(--line); background:var(--surface2); color:var(--text); flex:0 0 40px; cursor:pointer; padding:0;}

#timer .timer-demo[hidden]{display:none}#timer .timer-demo-label{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.09em;color:var(--accent2);margin:0 2px 9px}#timer .timer-demo video{display:block;width:100%;max-height:72vh;border-radius:13px;background:#000;object-fit:contain}#timer .timer-demo-caption{font-size:12.5px;line-height:1.4;color:var(--text-dim);margin:9px 3px 1px;white-space:pre-wrap}
#timer .tt{font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.12em; color:var(--accent2);}
#timer .clockbig{font-weight:800; font-variant-numeric:tabular-nums; font-size:76px; margin:12px 0; letter-spacing:-.02em;}
#timer .paused-info{color:var(--text-dim); font-size:15px; margin-bottom:20px; font-variant-numeric:tabular-nums;}
#timer .taunt{font-weight:800; font-size:19px; color:var(--accent2); line-height:1.35; max-width:420px; margin:18px 0 26px; min-height:60px;}
#timer .row{display:flex; gap:12px; width:100%; max-width:420px;}
#timer .row .btn{flex:1;}
@media(max-width:760px){#timer{padding:14px;align-items:flex-start}#timer.has-demo .timer-layout{grid-template-columns:1fr;gap:14px}#timer .timer-demo{order:-1;width:min(100%,430px);margin:0 auto}#timer .timer-demo video{max-height:38dvh}#timer .clockbig{font-size:48px;margin:6px 0}#timer .paused-info{margin-bottom:6px}#timer .taunt{font-size:15px;min-height:0;margin:8px 0 12px}#timer .timer-main{padding-bottom:env(safe-area-inset-bottom)}}

/* Toast */
#toast{position:fixed; bottom:114px; left:50%; transform:translateX(-50%) translateY(20px); background:#1b1f27; border:1px solid var(--line);
  color:var(--text); padding:13px 18px; border-radius:14px; font-size:14.5px; opacity:0; transition:.25s; z-index:100; pointer-events:none; max-width:90%; text-align:center; box-shadow:0 14px 34px rgba(0,0,0,.5);}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* Auth */
#auth{position:relative; max-width:440px; margin:0 auto; padding:24px 20px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center;}
.authback{position:absolute; top:14px; left:14px; z-index:6; display:inline-flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--line); color:var(--text); padding:9px 14px 9px 11px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer;}
.authback:hover{background:color-mix(in srgb,var(--accent) 14%, var(--surface));}
/* telas baixas / teclado aberto: começa do topo e rola, em vez de centralizar e cortar */
@media (max-height:760px){ #auth{ justify-content:flex-start; } }
/* Tablet: o formulário deixa de parecer uma miniatura no centro da tela. */
@media (min-width:600px) and (max-width:1199px){
  #auth{max-width:min(720px,88vw);padding:clamp(34px,6vw,68px);}
  .emblema.big{width:clamp(260px,38vw,390px)}
  .auth-sub{font-size:clamp(16px,2vw,20px)}
  .tabs button,.field input,.field select,.btn{font-size:clamp(16px,1.8vw,19px)}
  .field input,.field select{min-height:54px}.tabs button,.btn{min-height:52px}
}
/* logo se camufla no fundo escuro: 'screen' faz o preto do PNG sumir e só o brilho/desenho aparece
   (sem borda arredondada e sem drop-shadow retangular, que era o "quadrado" que aparecia) */
.emblema{width:190px; height:190px; margin:0 auto 2px; display:block; object-fit:contain; mix-blend-mode:screen;}
/* login: logo grande preenchendo o espaço (o nome "REDZONE" já está na própria arte) */
.emblema.big{width:min(62vw,238px); height:auto; aspect-ratio:1; margin-bottom:-4px;}
.auth-title{font-weight:800; font-size:34px; text-align:center; letter-spacing:-.01em;}
.auth-sub{text-align:center; color:var(--text-dim); margin:4px 0 24px; font-size:15px;}
.tabs{display:flex; gap:8px; margin-bottom:16px;}
.tabs button{flex:1; padding:13px; border-radius:14px; border:1px solid var(--line); background:transparent; color:var(--text-dim); font-weight:700; font-size:15px;}
.tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent;}
.stepper{display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:18px; color:var(--text-dim); font-size:13px; font-weight:700;}
.stepper .dotstep{width:28px; height:28px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:800;}
.stepper .dotstep.on{background:var(--accent); border-color:var(--accent); color:#fff;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.chip{display:inline-block; padding:5px 11px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid var(--line);}
.chip.bom{color:#8ff0b0; border-color:#2f7d4f;}
.chip.ruim{color:var(--accent2); border-color:color-mix(in srgb,var(--accent) 45%, var(--line));}
.chip.neutro{color:var(--text-dim);}

/* Temas grid */
.themes{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.theme-card{border-radius:18px; padding:14px; border:2px solid transparent; cursor:pointer; position:relative; min-height:82px; display:flex; flex-direction:column; justify-content:flex-end;}
.theme-card .tn{font-weight:800; font-size:15px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.7);}
.theme-card.sel{border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.14);}
.theme-card .check{position:absolute; top:8px; right:8px; font-size:16px;}

.report-bars{display:flex; align-items:flex-end; gap:6px; height:130px; padding-top:8px;}
.report-bars .bar{flex:1; background:linear-gradient(180deg,var(--accent2),var(--accent)); border-radius:8px 8px 0 0; min-height:3px; position:relative;}
.report-bars .bar span{position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:10px; color:var(--text-dim);}
.report-bars .bar b{position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:10px; color:var(--text); font-variant-numeric:tabular-nums;}
.seg{display:flex; gap:6px; margin:8px 0;}
.seg button{flex:1; padding:9px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--text-dim); font-size:12.5px; font-weight:700;}
.seg button.on{background:var(--accent); color:#fff; border-color:var(--accent);}
.hidden{display:none !important;}

/* Rotina: layout com calendário à direita */
.rotina-wrap{display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start;}
#scr-rotina>.section-title{margin-top:38px;margin-bottom:16px}#scr-rotina>.section-title+.small{margin-bottom:18px!important;line-height:1.55}#alarmPushStatus:not(:empty){margin:16px 0}#alarmList{margin-top:18px}.alarm-empty{padding:28px 20px;gap:9px}.alarm-empty span{line-height:1.5}
.rotina-col{flex:1 1 300px; min-width:0;}
.rotina-cal{flex:1 1 280px; min-width:0;}
/* Calendário branco e legível */
.calbox{background:var(--surface2); color:var(--text); border-radius:16px; padding:12px; border:1px solid var(--line); max-width:430px; margin:0 auto;}
.calhead{font-weight:800; font-size:15px; text-transform:capitalize; margin-bottom:10px; color:var(--text); text-align:center;}
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.caldow{margin-bottom:5px;}
.caldw{text-align:center; font-size:11px; font-weight:700; color:var(--text-dim);}
.calc{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:9px; font-size:12.5px; font-weight:700; background:var(--surface); color:var(--text); border:1px solid var(--line);}
.calc.empty{background:transparent; border:none;}
.calc.futuro{background:color-mix(in srgb,#fff 8%, var(--surface)); color:var(--text-dim);}
.calc.sem{background:var(--surface); color:var(--text);}
.calc.passado{background:color-mix(in srgb,var(--surface) 72%,#000);color:color-mix(in srgb,var(--text-dim) 70%,#000);border-color:transparent}
.calc.ok{background:color-mix(in srgb,var(--ok) 26%, var(--surface)); color:var(--ok); border-color:transparent;}
.calc.fail{background:color-mix(in srgb,var(--accent) 26%, var(--surface)); color:var(--accent2); border-color:transparent;}
.calc.hoje{box-shadow:0 0 0 2px var(--accent);}
.callegend{display:flex;gap:7px;margin-top:14px;font-size:11px;color:var(--text-dim);flex-wrap:wrap}
.callegend span{display:inline-flex; align-items:center; gap:4px;}
.callegend span{padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.callegend i{display:inline-block; width:12px; height:12px; border-radius:3px;}
.callegend .lok{background:var(--ok);} .callegend .lfail{background:var(--accent);} .callegend .lfut{background:var(--line);}
.callegend .ldot{background:var(--accent); border-radius:50%; width:8px; height:8px;}
/* Rotina calendário editável: 100% ✅, incompleto vermelho, futuro claro */
.calc.full{background:color-mix(in srgb,var(--ok) 24%, var(--surface)); color:var(--ok); cursor:pointer; font-size:16px;}
.calc.inc{background:color-mix(in srgb,var(--accent) 16%, var(--surface)); color:var(--accent2); font-weight:800; cursor:pointer; font-size:16px;}
/* dia futuro COM plano: anel branco suave (NÃO vermelho) só pra sinalizar que tem algo marcado */
.calc.futuro.plan{background:color-mix(in srgb,#fff 14%, var(--surface)); box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#fff 26%, transparent);}
.calc.selc{box-shadow:0 0 0 3px var(--accent); background:color-mix(in srgb,var(--accent) 22%, var(--surface)); color:var(--text);}
.calc[data-caldia]{cursor:pointer;}
/* Agenda (Início): calendário grande navegável + banner de aniversário */
.calbig{padding:16px;}
.calbig .calc{font-size:15px; border-radius:11px;}
.calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px;}
.calnav button{background:#e8ecef; border:1px solid #d7dde2; color:#1a1d22; width:38px; height:38px; border-radius:10px; font-size:22px; font-weight:800; line-height:1; cursor:pointer;}
.calnav button:active{background:#dbe1e6;}
.calc{position:relative;}
.calc.mark{cursor:pointer; font-weight:800; background:#fff; color:#1a1d22; box-shadow:inset 0 0 0 2px var(--accent);}
.calc .cdot{position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:6px; height:6px; border-radius:50%; background:var(--accent);}
.bday{background:linear-gradient(135deg,#ffb703,#fb8500); color:#3a1d00; border-radius:16px; padding:16px 18px; margin:14px 0 4px; font-weight:800; font-size:17px; text-align:center; line-height:1.35; box-shadow:0 8px 24px rgba(251,133,0,.28);}
.bday span{font-weight:600; font-size:13px; opacity:.9;}

/* Batalha social */
.icobtn{background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--text); width:40px; height:40px; border-radius:12px; font-size:18px; position:relative; display:flex; align-items:center; justify-content:center;}
.icobtn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.notif-badge{position:absolute; top:-5px; right:-5px; background:var(--accent); color:#fff; font-size:10px; font-weight:800; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px;}
.post-top .who-link{display:flex; align-items:center; gap:10px; cursor:pointer; flex:1; min-width:0;}
.post-menu{background:none; border:none; color:var(--text-dim); font-size:22px; line-height:1; padding:4px 8px; border-radius:8px;}
.busca-res{position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--surface2); border:1px solid var(--line); border-radius:14px; overflow:hidden; z-index:30; max-height:320px; overflow-y:auto;}
.busca-item{display:flex; align-items:center; gap:10px; padding:11px 12px; cursor:pointer; border-bottom:1px solid var(--line);}
.busca-item:last-child{border-bottom:none;}
.busca-item:hover{background:rgba(255,255,255,.04);}
.pgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px;}
.pcell{aspect-ratio:1; background:#000; border-radius:8px; overflow:hidden; cursor:pointer; position:relative;}
.pcell img,.pcell video{width:100%; height:100%; object-fit:cover;}
.pcell .pnomedia{width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:8px; font-size:11px; color:var(--text-dim); background:var(--surface2); text-align:center;}
.notif-item{display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line); border-radius:13px; margin:8px 0; background:var(--surface);}
.notif-item.nova{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 8%, var(--surface));}
/* Try Hard: flash vermelho + tremor da tela inteira */
.th-flash{position:fixed; inset:0; z-index:100; background:radial-gradient(circle,var(--accent2),var(--accent)); pointer-events:none; opacity:0;}
.th-flash.go{animation:thflash .7s ease-out;}
@keyframes thflash{0%{opacity:0}12%{opacity:.6}30%{opacity:.15}45%{opacity:.5}100%{opacity:0}}
@keyframes thshake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,4px)}30%{transform:translate(7px,-4px)}45%{transform:translate(-6px,-4px)}60%{transform:translate(6px,4px)}75%{transform:translate(-4px,2px)}}
body.th-shake{animation:thshake .55s;}

/* Recordações (memórias) */
.recfilt{display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none;}
.recfilt::-webkit-scrollbar{display:none;}
.chipf{flex:0 0 auto; background:var(--surface2); border:1px solid var(--line); color:var(--text-dim); padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;}
.chipf.on{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent;}
.rec-datehead{font-weight:800; font-size:13px; color:var(--text-dim); text-transform:capitalize; margin:14px 2px 8px;}
.rec-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:5px;}
@media (min-width:700px){ .rec-grid{grid-template-columns:repeat(5,1fr);} }
.rec-cell{position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:#000; cursor:pointer;}
.rec-cell img,.rec-cell video{width:100%; height:100%; object-fit:cover;}
.record-media-thumb{width:58px;height:58px;flex:0 0 58px;aspect-ratio:auto;border:2px solid color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 4px 14px #0005}
.record-media-thumb .rec-play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:18px;text-shadow:0 2px 5px #000;background:#0002}
.rec-badge{position:absolute; top:4px; left:4px; font-size:12px; filter:drop-shadow(0 1px 2px #000);}
.rec-play{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; text-shadow:0 2px 6px #000; pointer-events:none;}

/* Stories (topo do feed) */
.stories{display:flex; gap:12px; overflow-x:auto; padding:6px 2px 14px; scrollbar-width:none;}
.stories::-webkit-scrollbar{display:none;}
.story{flex:0 0 auto; width:66px; text-align:center; cursor:pointer;}
.story .ring2{width:64px; height:64px; border-radius:50%; padding:3px; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.story .ring2 > *{width:100%; height:100%; border-radius:50%; object-fit:cover; border:2px solid var(--bg,#0b0d10); display:block; background:#0c0d11;}
.story .slbl{font-size:10.5px; color:var(--text-dim); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.story.add .ring2{background:var(--line);} .story.add .ring2 > div{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--accent2);}
.story.seen .ring2{background:var(--line)}

/* Story viewer (fullscreen) */
.storyview{position:fixed; inset:0; z-index:80; background:#000; display:none; flex-direction:column;}
.storyview.on{display:flex;}
.storyview .bars{display:flex; gap:4px; padding:10px 12px 4px;}
.storyview .bars i{flex:1; height:3px; background:rgba(255,255,255,.3); border-radius:3px; overflow:hidden;}
.storyview .bars i b{display:block; height:100%; width:0; background:#fff;}
.storyview .media{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden;}
.storyview .media img,.storyview .media video{max-width:100%; max-height:100%; object-fit:contain;}
.storyview .cap{position:absolute; bottom:24px; left:16px; right:16px; color:#fff; font-size:15px; text-shadow:0 2px 6px #000;}
.storyview .navzone{position:absolute; top:60px; bottom:0; width:40%;}
.storyview .navL{left:0;} .storyview .navR{right:0;}
.storyview .closev{position:absolute; top:12px; right:14px; z-index:2; background:rgba(0,0,0,.4); border:none; color:#fff; width:36px; height:36px; border-radius:50%; font-size:20px;}
.storyview .menuv{position:absolute;top:12px;right:58px;z-index:3;background:rgba(0,0,0,.45);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:22px}
.storyview .storyhead{position:absolute;z-index:3;top:22px;left:14px;right:104px;display:flex;align-items:center;gap:9px;color:#fff;text-shadow:0 2px 7px #000}.storyview .storyhead img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.7)}.storyview .storyhead b,.storyview .storyhead small{display:block}.storyview .storyhead small{opacity:.8}.storyview .storyaction{position:absolute;z-index:5;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.58);backdrop-filter:blur(10px);color:#fff;border-radius:999px;padding:10px 17px;font-weight:800;white-space:nowrap}.storyview .storyaction[hidden]{display:none}.storyview.paused #storyBarActive{animation-play-state:paused!important}
.storyview:has(.storyaction:not([hidden])) .cap{bottom:calc(76px + env(safe-area-inset-bottom))}
#storyFeed{left:auto;right:16px;transform:none}#storyViewers{max-width:46%;overflow:hidden;text-overflow:ellipsis}
.story-viewers-panel{position:fixed;inset:0;z-index:175;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}.story-viewers-box{width:min(520px,100%);max-height:70dvh;overflow-y:auto;background:var(--surface);color:var(--text);border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 55px rgba(0,0,0,.55)}.story-viewers-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.story-viewers-head button{width:38px;height:38px;border:0;border-radius:50%;background:var(--surface2);color:var(--text);font-size:20px}

/* ============================================================
   RESPONSIVO
============================================================ */
/* CELULAR estreito: dá respiro pros números do Início (não colar um no outro) */

  .topbar{gap:5px}.topbar>div{gap:7px!important}.topbar .icobtn{width:36px;height:36px;border-radius:10px}.topbar .homeclock .hc-time{font-size:19px}.topbar .homeclock .hc-date{display:none}.topbar .brand{font-size:18px}
  .biorow{gap:8px; margin:14px 0 4px;}

  .hamb{display:none !important;}

  #app{max-width:880px; margin:0 auto; padding-left:108px; padding-bottom:44px;}

@media (min-width:1280px){

}
@media (min-width:1700px){
  #app{max-width:min(1760px,calc(100vw - 140px));}
  body{font-size:clamp(18px,1vw,22px);}

const API_BASE = location.pathname.includes('/rotina') ? '/rotina/api' : 'https://redsystems.ddns.net/rotina/api';

/* ---------- OFFLINE: fila de escrita + cache (não perder progresso sem internet) ---------- */
function offQueue(){ try{ return JSON.parse(localStorage.getItem(userStorageKey('queue'))||'[]'); }catch{ return []; } }
function setQueue(q){ try{ localStorage.setItem(userStorageKey('queue'), JSON.stringify(q)); }catch{} }
const _stateVersoes={};
let _accountResetId=null;
function novaVersao(chave){ const agora=Math.trunc(Date.now()+(typeof _serverClockOffset==='number'?_serverClockOffset:0)),v=Math.trunc(Math.max(agora,Number(_stateVersoes[chave]||0)+1)); _stateVersoes[chave]=v; return v; }
let _flushando=false;
async function flushQueue(){
  if(_flushando || !authToken) return; _flushando=true;
  let q=offQueue(); const rest=[]; let ok=0;
  for(const it of q){ try{ await api('/state/'+encodeURIComponent(it.chave),{method:'PUT',body:{valor:it.valor,versao:it.versao||novaVersao(it.chave),clientId:CLIENT_ID,resetId:_accountResetId}}); ok++; }catch(e){ if(e?.status===409&&e?.data?.reset){ setQueue([]); location.reload(); break; } rest.push(it); } }
  setQueue(rest); _flushando=false;
  return rest.length===0;
}

// ANTI-LOOP: ao aplicar uma mudança que VEIO do servidor, um re-render pode disparar escritas de
// efeito colateral (reportXP/saveProfile/save) que voltariam a emitir e criariam ping-pong entre

/* ---------- STORE: dados pessoais por usuário (backend + offline) ---------- */
const Store = {
  async get(key){ try{ return await api('/state/'+encodeURIComponent(key)); }catch(e){ return null; } },
  async set(key,val){
    const versao=novaVersao(key);
    try{ localStorage.setItem(userStorageKey('local:'+key), JSON.stringify(val)); }catch{}   // espelho local
    try{ const r=await api('/state/'+encodeURIComponent(key),{method:'PUT',body:{valor:val,versao,clientId:CLIENT_ID,resetId:_accountResetId}}); if(Number.isFinite(r?.xp))S.profile.xp=r.xp; if(r?.ignorada){ applyRemoteState(key,r.valor,r.versao); } else if(key==='rotina:dias'&&r?.valor&&Number(r.versao||versao)>=Number(_stateVersoes[key]||0)){ S.rotinaDias=r.valor; try{ localStorage.setItem(userStorageKey('local:'+key),JSON.stringify(r.valor)); }catch{} } return true; }
    catch(e){
      if(e?.status===409&&e?.data?.reset){ setQueue([]); location.reload(); return false; }
      const q=offQueue().filter(i=>i.chave!==key); q.push({chave:key, valor:val}); setQueue(q);  // enfileira (última escrita vence)
      return true;
    }
  },
  async del(key){ try{ await api('/state/'+encodeURIComponent(key)+'?src='+encodeURIComponent(CLIENT_ID),{method:'DELETE'}); }catch(e){} },
};
// aplica uma mudança de estado vinda de OUTRO aparelho do mesmo usuário (sync ao vivo)
function applyRemoteState(chave, valor, versao=0){
  if(!S) return; const prop=cameMap(chave); if(!prop) return;
  if(versao&&Number(versao)<Number(_stateVersoes[chave]||0)) return;
  if(versao) _stateVersoes[chave]=Number(versao);
  if(valor===null || valor===undefined) return;   // delete: ignora (raro; próximo load resolve)
  if(chave==='rotina:dias') valor=mergeRotinaDiasLocal(S.rotinaDias,valor);
  S[prop]=valor;
  try{ localStorage.setItem(userStorageKey('local:'+chave), JSON.stringify(valor)); }catch{}
  // atualiza o cache do estado completo pra ficar consistente offline
  try{ const k=userStorageKey('cache:st'), c=JSON.parse(localStorage.getItem(k)||'{}'); c[chave]=valor; localStorage.setItem(k, JSON.stringify(c)); }catch{}
  _syncHold();   // segura escritas de efeito colateral do re-render (anti-loop)
  if(activeTab && _syncPodeRender()){ try{ go(activeTab); }catch(e){} }
}
function mergeRotinaDiasLocal(atual,remoto){
  if(!atual||!remoto||typeof atual!=='object'||typeof remoto!=='object') return remoto;
  const out={...remoto};
  Object.entries(remoto).forEach(([iso,lista])=>{ if(!Array.isArray(lista)) return; const locais=new Map((Array.isArray(atual[iso])?atual[iso]:[]).map(a=>[a.id,a])); out[iso]=lista.map(r=>{ const l=locais.get(r.id); return l&&Number(l.updatedAt||0)>Number(r.updatedAt||0)?l:r; }); });
  return out;
}

// lê número aceitando vírgula (89,50 -> 89.5). Retorna NaN se vazio/invalido.
function numBR(v){ if(v==null) return NaN; const s=String(v).trim().replace(/\s/g,'').replace(',','.'); return s===''?NaN:Number(s); }
// peso: aceita com/sem vírgula. Sem separador e >300 => trata os 2 últimos dígitos como decimais (8895 -> 88,95).
function parsePeso(v){ const raw=String(v??'').trim(); if(/[.,]/.test(raw)) return numBR(raw); const n=Number(raw); if(!isFinite(n)) return NaN; return n>300 ? n/100 : n; }

// altura em cm (176) -> metros com vírgula pra exibição ("1,76"). A máquina põe a vírgula.
function fmtAltura(cm){ if(cm==null||isNaN(cm)) return ''; return (Number(cm)/100).toFixed(2).replace('.',','); }
// Data civil (YYYY-MM-DD) sem conversão UTC. Evita 22/08 virar 21/08 em Fortaleza.
function dataCivil(data){ const [y,m,d]=String(data||'').slice(0,10).split('-').map(Number); if(!y||!m||!d)return null; const x=new Date(y,m-1,d); return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?x:null; }
// idade a partir da data de nascimento (YYYY-MM-DD)
function idadeDe(dataNasc){ const d=dataCivil(dataNasc); if(!d) return null; const h=brasiliaNow(); let a=h.getFullYear()-d.getFullYear(); const m=h.getMonth()-d.getMonth(); if(m<0||(m===0&&h.getDate()<d.getDate())) a--; return a; }

/* ---------- CRYPTO (PBKDF2 + salt — código do Felipe) ---------- */
const bufferToHex = b => Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
const hexToBuffer = h => new Uint8Array(h.match(/.{1,2}/g).map(b=>parseInt(b,16)));
async function hashPassword(password, existingSaltHex=null){
  const enc=new TextEncoder(); const pwBuf=enc.encode(password);
  const salt = existingSaltHex ? hexToBuffer(existingSaltHex) : crypto.getRandomValues(new Uint8Array(16));
  const km = await crypto.subtle.importKey('raw', pwBuf, 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, km, 256);
  return { hashHex: bufferToHex(bits), saltHex: bufferToHex(salt) };
}

/* ---------- COMPRESSÃO DE IMAGEM (canvas, antes de qualquer upload) ---------- */
function compressImage(file, maxSize=1000, quality=0.72){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{ const img=new Image(); img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } }
      else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',quality));
    }; img.onerror=rej; img.src=e.target.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------------------------
   SISTEMA DE INSÍGNIAS SVG — inspirado na graduação de praças do Exército BR
   (divisas em "V" douradas sobre patch escuro; estrela pra graduação de sargento).
   Arte original — não reproduz brasão/insígnia oficial protegida.
   Progressão:  Recruta (patch limpo) → Soldado (1 divisa) → Cabo (2 divisas)
                → 3º Sargento (3 divisas + estrela).
--------------------------------------------------------------------------- */
function insignia(rankId, cls='insignia'){
  const r = RANKS.find(x=>x.id===rankId)||RANKS[0];
  const n = r.divisas; // 0=Recruta, 1=Soldado, 2=Cabo, 3=3º Sargento
  // divisas brancas em "V" sobre patch verde (padrão graduação de praça EB)
  let chevrons='';
  const x1=4.5, cx=19, x2=33.5, arm=9, gap=11, center=40; // viewBox 38x68
  for(let i=0;i<n;i++){
    const ay = center + ((n-1)/2 - i)*gap; // apex, grupo no terço inferior
    chevrons += `<path d="M${x1} ${ay+arm} L${cx} ${ay} L${x2} ${ay+arm}" fill="none" stroke="#fbfdfa" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>`;
  }
  return `<svg class="${cls}" viewBox="0 0 38 68" xmlns="http://www.w3.org/2000/svg">
    <rect x="1.4" y="1.4" width="35.2" height="65.2" rx="1.5" fill="#35512e" stroke="#1f3a1b" stroke-width="1"/>
    <rect x="3.6" y="3.6" width="30.8" height="60.8" rx="1" fill="none" stroke="#eef3ea" stroke-width="1.1"/>
    ${chevrons}
  </svg>`;
}

let S = null;            // dados do usuário logado (perfil + tudo)
let currentUser = null;  // username

const DEFAULT_TREINO_TEMPLATE = ()=>({ seg:[], ter:[], qua:[], qui:[], sex:[], sab:[], dom:[] });

async function loadUserData(){
  let me, st;
  try{
    me = await api('/auth/me');                // { usuario, xp, patente }
    st = await api('/state');                  // { chave: valor, ... }
    try{ localStorage.setItem(userStorageKey('cache:me'), JSON.stringify(me)); localStorage.setItem(userStorageKey('cache:st'), JSON.stringify(st)); }catch{}
  }catch(e){
    // Token expirado/conta removida não é modo offline: nunca abra dados antigos de outra sessão.
    if(e?.status===401||e?.status===403||e?.status===404){ setToken(null); throw e; }
    const cme=localStorage.getItem(userStorageKey('cache:me')), cst=localStorage.getItem(userStorageKey('cache:st'));
    if(cme && cst){ me=JSON.parse(cme); st=JSON.parse(cst); }
    else throw e;   // sem cache e sem internet: não dá pra entrar
  }
  // Reset administrativo é fonte da verdade: elimina cache/fila antigos deste
  // aparelho antes que uma escrita offline consiga ressuscitar dados apagados.
  const resetId=st?.['system:reset']?.id;
  if(resetId){
    _accountResetId=String(resetId);
    const resetKey=userStorageKey('reset:id');
    if(localStorage.getItem(resetKey)!==String(resetId)){
      const dono=tokenOwner(); limparLocalDoUsuario(dono);
      localStorage.setItem(resetKey,String(resetId));
      localStorage.setItem(userStorageKey('cache:me'),JSON.stringify(me));
      localStorage.setItem(userStorageKey('cache:st'),JSON.stringify(st));
    }
    delete st['system:reset'];
  }
  // aplica escritas offline pendentes por cima do que veio do servidor
  offQueue().forEach(it=>{ st[it.chave]=it.valor; });
  const u = me.usuario;
  const g = (k,d)=> st[k]!==undefined && st[k]!==null ? st[k] : d;
  S = {
    profile: { id:u.id, nome:u.nomeGuerra, username:u.username, email:u.email, foto:u.fotoUrl, genero:u.genero, criadoEm:u.criadoEm,
               idade:u.idade, dataNasc:(u.dataNasc?String(u.dataNasc).slice(0,10):null), peso:u.pesoKg, altura:u.alturaCm, metaAgua:u.metaAgua, tema:u.tema, privado:u.privado, isAdmin:!!u.isAdmin, xp:Number(me.xp??u.xp??0), xpBonus:g('xp:bonus',0) },
    treinoTemplate: g('treino:tpl', DEFAULT_TREINO_TEMPLATE()),
    treinoWeeks:    g('treino:weeks', null),
    treinoLogs:     g('treino:logs', []),
    recordes:       g('treino:recordes', []),
    materias:       g('estudo:materias', []),
    estudoSemana:   g('estudo:semana', DEFAULT_TREINO_TEMPLATE()),
    estudoLogs:     g('estudo:logs', []),
    alimSemana:     g('alim:semana', DEFAULT_TREINO_TEMPLATE()),
    pesos:          g('alim:pesos', []),
    alimHist:       g('alim:hist', {ref:null, hist:[]}),   // análises semanais arquivadas
    agua:           g('alim:agua', {}),
    rotina:         g('rotina', []),
    rotinaHist:     g('rotina:hist', {}),
    rotinaPlano:    g('rotina:plano', {dias:{}, padrao:''}),   // (legado) plano por dia em texto
    rotinaDias:     g('rotina:dias', {}),   // atividades por dia: {iso:[{id,nome,hora,done}]}
    alarmes:        g('rotina:alarmes', []),
    config:         g('config', {editMode:false, tryHard:false, notif:false}),
    datas:          g('datas', []),   // aniversários + datas importantes
    recordacoes:    g('recordacoes', []),   // memórias: mídia por data (treino/alim/estudo)
  };
  await garantirSemanaAlimAtual(false); // segunda-feira: arquiva e inicia a nova semana sem depender de botão
  if(!S.treinoWeeks){ S.treinoWeeks = [{ id:uid(), startISO:mondayOfISO(todayISO()), exec:{} }]; await save('treino:weeks'); }
  currentUser = u.username;
  applyTheme(S.profile.tema||'red');
}
let _profileSaveChain=Promise.resolve();
function saveProfile(){
  if(_syncBusy()) return Promise.resolve();
  // Serializa alterações rápidas: a última escolha sempre é a última a chegar
  // ao servidor, evitando um tema antigo vencer por diferença de conexão.
  _profileSaveChain=_profileSaveChain.catch(()=>{}).then(async()=>{
    const p={...S.profile};
    try{const r=await api('/perfil',{method:'PATCH',body:{nomeGuerra:p.nome,username:p.username,idade:p.idade,pesoKg:p.peso,alturaCm:p.altura,fotoUrl:p.foto,bio:p.bio||'',tema:p.tema,metaAgua:p.metaAgua,xp:computeXP(),clientId:CLIENT_ID}});if(r?.usuario)applyRemoteProfile(r.usuario)}catch(e){console.error(e)}
    await Store.set('perfil:dados',{nome:p.nome,username:p.username,peso:p.peso,altura:p.altura});
  });
  return _profileSaveChain;
}
// aplica mudança de PERFIL vinda de outro aparelho (nome/foto/tema/gênero…) — sync ao vivo
function applyRemoteProfile(u){
  if(!S||!u) return;
  const before=JSON.stringify(S.profile);
  S.profile.nome=u.nomeGuerra ?? S.profile.nome;
  S.profile.username=u.username ?? S.profile.username;
  S.profile.bio=u.bio ?? S.profile.bio ?? '';
  S.profile.foto=(u.fotoUrl!==undefined)?u.fotoUrl:S.profile.foto;
  S.profile.genero=u.genero ?? S.profile.genero;
  S.profile.tema=u.tema ?? S.profile.tema;
  S.profile.peso=u.pesoKg ?? S.profile.peso;
  S.profile.altura=u.alturaCm ?? S.profile.altura;
  S.profile.metaAgua=u.metaAgua ?? S.profile.metaAgua;
  if(Number.isFinite(Number(u.xp)))S.profile.xp=Number(u.xp);
  S.profile.privado=(u.privado!==undefined)?u.privado:S.profile.privado;
  if(JSON.stringify(S.profile)===before) return;   // nada mudou de verdade
  applyTheme(S.profile.tema||'red');
  try{ const k=userStorageKey('cache:me'), c=JSON.parse(localStorage.getItem(k)||'{}'); if(c.usuario){ c.usuario={...c.usuario, ...u}; localStorage.setItem(k, JSON.stringify(c)); } }catch{}
  _syncHold();   // segura escritas de efeito colateral do re-render (anti-loop)
  if(activeTab && _syncPodeRender()){ try{ go(activeTab); }catch(e){} }
}
async function save(k){ await Store.set(k, S[cameMap(k)]); }
function cameMap(k){ return ({'xp:bonus':'xpBonus','treino:tpl':'treinoTemplate','treino:weeks':'treinoWeeks','treino:logs':'treinoLogs','treino:recordes':'recordes','estudo:materias':'materias','estudo:semana':'estudoSemana','estudo:logs':'estudoLogs','alim:semana':'alimSemana','alim:pesos':'pesos','alim:agua':'agua','alim:hist':'alimHist','rotina':'rotina','rotina:hist':'rotinaHist','rotina:plano':'rotinaPlano','rotina:dias':'rotinaDias','rotina:alarmes':'alarmes','config':'config','datas':'datas','recordacoes':'recordacoes'})[k]; }

/* XP total do usuário = soma de logs + bônus, menos punições. Recalcula. */
function computeXP(){
  if(Number.isFinite(Number(S?.profile?.xp))) return Math.max(0,Math.floor(Number(S.profile.xp)));
  let xp=0;
  S.treinoLogs.forEach(l=> xp += Math.floor((l.ativoMs||0)/60000) );          // 1 xp / min treino
  S.estudoLogs.forEach(l=> xp += Math.floor((l.ativoMs||0)/60000)*2 );         // 2 xp / min estudo
  S.estudoLogs.forEach(l=> xp += (l.conteudos?.length||0)*40 );                // 40 xp / conteúdo concluído
  Object.entries(S.agua||{}).forEach(([dia,v])=>{ const ml=Number(v); if(/^\d{4}-\d{2}-\d{2}$/.test(dia)&&dia<=todayISO()&&Number.isFinite(ml)&&ml>0&&ml<=20000&&ml>=(S.profile.metaAgua||2500)) xp+=15; });
  (S.profile.xpBonus||0) && (xp += S.profile.xpBonus);
  return Math.max(0, xp);
}

function emailCheck(e){e=String(e||'').trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,63}$/i.test(e))return{ok:false,msg:'E-mail inválido. Confira o endereço completo.'};const d=e.split('@')[1],fix=EMAIL_DOMAIN_FIX[d];if(fix)return{ok:false,msg:`O domínio “${d}” parece errado. Você quis dizer ${e.slice(0,e.lastIndexOf('@')+1)}${fix}?`};if(/\.(coml|comm|con|cmo|nett|orgg)$/i.test(d))return{ok:false,msg:`O domínio “${d}” não é válido.`};return{ok:true};}
function validEmail(e){return emailCheck(e).ok;}

async function signupNext(){

  if(p.length<6) return err.textContent='Senha muito curta (mínimo 6).';
  if(p!==p2) return err.textContent='As senhas não conferem.';

}

function ativarGestoMenu(){
  let gesto=null;
  document.addEventListener('pointerdown',e=>{
    if(!e.isPrimary||e.pointerType==='mouse'||innerWidth>=900||e.clientX>28||$('#app')?.classList.contains('hidden')||$('#nav')?.classList.contains('open'))return;
    if($('#overlay')?.classList.contains('show')||$('#storyview')?.classList.contains('on')||$('#timer')?.classList.contains('on')||$('.system-notice.show,.media-lightbox.show,.chat-viewer.show'))return;
    gesto={id:e.pointerId,x:e.clientX,y:e.clientY,arrastando:false};
  },true);
  document.addEventListener('pointermove',e=>{
    if(!gesto||e.pointerId!==gesto.id)return;const dx=e.clientX-gesto.x,dy=e.clientY-gesto.y;
    if(!gesto.arrastando){if(dx<10&&Math.abs(dy)<10)return;if(dx<=0||Math.abs(dx)<Math.abs(dy)*1.15){gesto=null;return;}gesto.arrastando=true;$('#nav').classList.add('swiping');$('#navBackdrop').classList.add('swiping');}
    e.preventDefault();const largura=$('#nav').getBoundingClientRect().width||250,avanco=Math.min(largura,Math.max(0,dx));$('#nav').style.transform=`translateX(${avanco-largura}px)`;$('#navBackdrop').style.opacity=String(Math.min(1,avanco/largura));
  },{capture:true,passive:false});
  const terminar=(e,cancelado=false)=>{if(!gesto||e.pointerId!==gesto.id)return;const dx=e.clientX-gesto.x,dy=e.clientY-gesto.y,abrir=!cancelado&&gesto.arrastando&&dx>=70&&Math.abs(dx)>Math.abs(dy)*1.15;gesto=null;if(abrir)openDrawer();else closeDrawer();};
  document.addEventListener('pointerup',e=>terminar(e),true);document.addEventListener('pointercancel',e=>terminar(e,true),true);
}

  if(!dn){ openSheet('<h3>Aniversário</h3><p class="muted small">Cadastre sua data de nascimento no Perfil pra eu contar os dias.</p>'); return; }
  const [Y,M,D]=String(dn).split('-').map(Number);
  const h=brasiliaNow();
  let occ=new Date(h.getFullYear(),M-1,D,0,0,0);
  const ehHoje=h.getMonth()===M-1&&h.getDate()===D;
  if(ehHoje) occ=new Date(h); else if(occ<h) occ=new Date(h.getFullYear()+1,M-1,D);
  const idade=idadeDe(dn); const faraIdade=occ.getFullYear()-Y;
  openSheet(`<h3>Seu aniversário</h3>
    <p class="small muted">Hoje você tem ${idade} anos.</p>
    <div class="card"><div class="h" id="bdayTitle"></div><div id="bdayCount" class="grid2" style="margin-top:12px"></div><p class="small muted" id="bdayExact" style="margin-top:12px"></p></div>`);
  clearInterval(window._bdayTimer);
  const tick=()=>{ if(!$('#bdayCount')){ clearInterval(window._bdayTimer); return; } const agora=brasiliaNow(), ms=Math.max(0,occ-agora); const totalDias=Math.floor(ms/86400000), horas=Math.floor(ms%86400000/3600000), minutos=Math.floor(ms%3600000/60000), segundos=Math.floor(ms%60000/1000); let meses=(occ.getFullYear()-agora.getFullYear())*12+(occ.getMonth()-agora.getMonth()); let ancora=new Date(agora.getFullYear(),agora.getMonth()+meses,agora.getDate(),agora.getHours(),agora.getMinutes(),agora.getSeconds()); if(ancora>occ){ meses--; ancora=new Date(agora.getFullYear(),agora.getMonth()+meses,agora.getDate(),agora.getHours(),agora.getMinutes(),agora.getSeconds()); } const anos=Math.floor(meses/12), mesesRest=Math.max(0,meses%12), diasRest=Math.max(0,Math.floor((occ-ancora)/86400000)); $('#bdayTitle').textContent=ms<1000?`🎂 É hoje! Você está fazendo ${faraIdade} anos!`:`🎉 Contagem para os ${faraIdade} anos`; const partes=[]; if(anos) partes.push(['Anos',anos]); if(mesesRest) partes.push(['Meses',mesesRest]); if(diasRest||(!anos&&!mesesRest&&totalDias>0)) partes.push(['Dias',diasRest||totalDias]); if(totalDias<2&&ms>=1000) partes.push(['Horas',horas]); if(totalDias<1&&ms>=1000) partes.push(['Minutos',minutos],['Segundos',segundos]); $('#bdayCount').innerHTML=partes.map(([l,v])=>`<div class="card" style="text-align:center;margin:0"><div class="mono" style="font-size:26px;color:var(--accent2)">${v}</div><div class="small muted">${l}</div></div>`).join(''); $('#bdayExact').textContent=`Data: ${occ.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}.`; };
  tick(); window._bdayTimer=setInterval(tick,1000);
}
// clicar no peso → relatório/evolução de peso
function pesoRelatorioSheet(){
  // peso é salvo como {dateISO, peso}; tolera também .valor (dados antigos)
  const pv = p => (p.peso!=null ? p.peso : p.valor);
  const pesos=[...(S.pesos||[])].filter(p=>isFinite(pv(p))).sort((a,b)=>String(a.dateISO).localeCompare(String(b.dateISO)));
  const atual=S.profile.peso;
  if(!pesos.length){ openSheet(`<h3>Relatório de peso</h3><p class="muted small">Peso atual: <b>${fmtPeso(atual)} kg</b>. Registre seu peso na Alimentação pra montar a evolução.</p>`); return; }
  const first=pv(pesos[0]), last=pv(pesos[pesos.length-1]), delta=last-first;
  const vals=pesos.map(pv); const max=Math.max(...vals), min=Math.min(...vals);
  const linhas=pesos.slice(-12).reverse().map(p=>`<div class="rowitem"><div class="txt"><div class="t">${fmtPeso(pv(p))} kg</div><div class="s mono">${new Date(p.dateISO+'T00:00:00').toLocaleDateString('pt-BR')}</div></div></div>`).join('');
  openSheet(`<h3>Relatório de peso</h3>
    <div class="card"><div style="display:flex;justify-content:space-around;text-align:center">
      <div><div class="muted small">Atual</div><div style="font-weight:800;font-size:22px">${fmtPeso(last)}</div></div>
      <div><div class="muted small">Variação</div><div style="font-weight:800;font-size:22px;color:${delta<0?'var(--ok)':delta>0?'var(--accent2)':'var(--text)'}">${delta>0?'+':''}${delta.toFixed(2).replace('.',',')} kg</div></div>
      <div><div class="muted small">Mín/Máx</div><div style="font-weight:800;font-size:16px">${fmtPeso(min)}–${fmtPeso(max)}</div></div>
    </div></div>
    <div class="section-title" style="margin-top:8px">Histórico</div>${linhas}`);
}
// Extrato local de contingência. A API usa exatamente as mesmas regras e é a
// fonte oficial; esta cópia mantém o histórico legível quando o aparelho está offline.
function extratoXpLocal(){
  const itens=[];
  const hoje=todayISO(), dataOk=iso=>/^\d{4}-\d{2}-\d{2}$/.test(iso)&&iso<=hoje;
  (S.treinoLogs||[]).forEach(l=>{ const ms=Number(l.ativoMs||0),m=Math.floor(ms/60000); if(dataOk(l.dateISO)&&ms>=60000&&ms<=86400000) itens.push({tipo:'treino',dateISO:l.dateISO, at:l.updatedAt||0,xp:m,txt:`Treino: ${l.nome||'sessão'} · ${m} min ativo(s)`}); });
  (S.estudoLogs||[]).forEach(l=>{ const ms=Number(l.ativoMs||0),m=Math.floor(ms/60000); if(!dataOk(l.dateISO))return;if(ms>=60000&&ms<=86400000&&m>0)itens.push({tipo:'estudo',dateISO:l.dateISO,at:l.updatedAt||0,xp:m*2,txt:`Estudo: ${l.materia||'matéria'} · ${m} min × 2 XP`});
    [...new Set(l.conteudos||[])].forEach(cid=>{ const mat=(S.materias||[]).find(x=>x.id===l.materiaId),conteudo=conteudosMateria(mat).find(x=>x.id===cid); itens.push({tipo:'estudo',dateISO:l.dateISO,at:l.updatedAt||0,xp:40,txt:`Conteúdo concluído: ${conteudo?.nome||cid}`}); }); });
  Object.entries(S.agua||{}).forEach(([iso,v])=>{ const ml=Number(v),meta=Number(S.profile.metaAgua||2500); if(dataOk(iso)&&Number.isFinite(ml)&&ml>0&&ml<=20000&&ml>=meta) itens.push({tipo:'agua',dateISO:iso,xp:15,txt:`Meta de água: ${ml.toLocaleString('pt-BR')} de ${meta.toLocaleString('pt-BR')} ml`}); });
  Object.entries(S.rotinaDias||{}).forEach(([iso,acts])=>{ if(!dataOk(iso)||!Array.isArray(acts))return; acts.forEach(a=>itens.push({tipo:'rotina',dateISO:iso,at:a.updatedAt||0,xp:a.done?10:(iso<hoje?-10:0),txt:a.done?`Rotina cumprida: ${a.nome}${a.hora?` (${a.hora})`:''}`:`Rotina não cumprida: ${a.nome}${a.hora?` (${a.hora})`:''}`})); });
  for(let i=itens.length-1;i>=0;i--)if(!itens[i].xp)itens.splice(i,1);
  if(S.profile.xpBonus) itens.push({tipo:'ajustes',dateISO:todayISO(), xp:S.profile.xpBonus, txt:'Bônus/ajuste administrativo'});
  itens.sort((a,b)=>String(b.dateISO).localeCompare(String(a.dateISO))||(b.at||0)-(a.at||0));
  const ganhos=itens.filter(i=>i.xp>0).reduce((s,i)=>s+i.xp,0), perdas=itens.filter(i=>i.xp<0).reduce((s,i)=>s+i.xp,0);
  return {total:Math.max(0,Math.floor(ganhos+perdas)),ganhos,perdas,itens};
}

/* ---------- AGENDA: aniversários + datas importantes ---------- */
let agViewY=null, agViewM=null;   // mês/ano em exibição no calendário grande
const MESES_NOME=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// tipo de repetição da data: nao | dia | semana | mes | ano
function repeteDe(item){ if(item.repete) return item.repete; return item.recorrente===false?'nao':'ano'; }
const REPETE_LBL={nao:'data única', dia:'todo dia', semana:'toda semana', mes:'todo mês', ano:'todo ano'};
function dataAgendaValida(y,m,d){ const x=new Date(y,m-1,d); x.setHours(0,0,0,0); return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?x:null; }
// próxima ocorrência (Date à meia-noite Brasília) conforme a repetição
function proximaOcorrencia(item){
  const [Y,M,D]=String(item.data).split('-').map(Number);
  if(!dataAgendaValida(Y,M,D)) return null;
  const h=brasiliaNow(); h.setHours(0,0,0,0);
  const rep=repeteDe(item);
  if(rep==='nao'){ const o=dataAgendaValida(Y,M,D); return o>=h?o:null; }
  if(rep==='dia'){ return h; }
  if(rep==='semana'){ const dow=dataAgendaValida(Y,M,D).getDay(); const o=new Date(h); o.setDate(h.getDate()+((dow-h.getDay()+7)%7)); return o; }
  if(rep==='mes'){ for(let i=0;i<24;i++){ const base=new Date(h.getFullYear(),h.getMonth()+i,1), o=dataAgendaValida(base.getFullYear(),base.getMonth()+1,D); if(o&&o>=h) return o; } return null; }
  for(let y=h.getFullYear();y<=h.getFullYear()+8;y++){ const o=dataAgendaValida(y,M,D); if(o&&o>=h) return o; }
  return null;
}
function diasAte(date){ const h=brasiliaNow(); h.setHours(0,0,0,0); return Math.round((date-h)/86400000); }
function contagemTxt(n){ return n===0?'HOJE 🎉' : n===1?'amanhã' : `em ${n} dias`; }

function renderAgenda(){
  const box=$('#agendaBox'); if(!box) return;
  const now=brasiliaNow();
  if(agViewY==null){ agViewY=now.getFullYear(); agViewM=now.getMonth(); }
  const datas=S.datas||[];

  // dias marcados no mês em exibição -> id da data
  const marks={}; // dia -> [itens]
  const dim=new Date(agViewY,agViewM+1,0).getDate();
  const push=(d,it)=>{ if(d>=1&&d<=dim){ (marks[d]=marks[d]||[]).push(it); } };
  datas.forEach(it=>{
    const [Y,M,D]=String(it.data).split('-').map(Number);
    if(!M||!D) return;
    const rep=repeteDe(it);
    if(rep==='dia'){ for(let d=1;d<=dim;d++) push(d,it); }
    else if(rep==='semana'){ const dow=new Date(Y,M-1,D).getDay(); for(let d=1;d<=dim;d++){ if(new Date(agViewY,agViewM,d).getDay()===dow) push(d,it); } }
    else if(rep==='mes'){ push(D,it); }
    else if(rep==='ano'){ if(M-1===agViewM) push(D,it); }
    else { if(Y===agViewY && M-1===agViewM) push(D,it); }   // nao
  });

  const startDow=new Date(agViewY,agViewM,1).getDay();
  const hojeISO=todayISO();
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="calc empty"></div>';
  for(let d=1; d<=dim; d++){
    const iso=`${agViewY}-${String(agViewM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const tem=marks[d]&&marks[d].length;
    let cls='sem'; if(tem) cls='mark';
    if(iso===hojeISO) cls+=' hoje';
    cells+=`<div class="calc ${cls}" ${tem?`data-agday="${d}"`:''}>${d}${tem?'<i class="cdot"></i>':''}</div>`;
  }

  // próximas datas (ordenadas pela proximidade)
  const prox=datas.map(it=>({it, o:proximaOcorrencia(it)})).filter(x=>x.o)
    .map(x=>({...x, d:diasAte(x.o)})).sort((a,b)=>a.d-b.d);
  const listHTML = prox.length ? prox.map(x=>{
    const it=x.it; const ico=it.tipo==='evento'?'📌':'🎂';
    const idadeF = x.o.getFullYear()-it.anoBase;
    const anos = (it.tipo!=='evento' && it.recorrente!==false && it.anoBase && idadeF>0 && idadeF<130) ? ` · fará ${idadeF}` : '';
    return `<div class="rowitem" data-agedit="${it.id}" style="cursor:pointer">
      <div style="font-size:22px;width:34px;text-align:center">${ico}</div>
      <div class="txt"><div class="t">${esc(it.nome)}</div>
        <div class="s">${x.o.toLocaleDateString('pt-BR',{day:'2-digit',month:'long'})}${anos} · <b style="color:var(--accent)">${contagemTxt(x.d)}</b></div></div>
    </div>`;
  }).join('') : `<p class="muted small" style="margin:6px 2px">Nenhuma data marcada. Toque em <b>＋ Adicionar</b> pra registrar aniversários e datas importantes — o app te avisa 1 mês, 1 semana, 1 dia antes e no dia.</p>`;

  box.innerHTML=`
    <div class="calbox calbig">
      <div class="calnav">
        <button id="agPrev" aria-label="Anterior">‹</button>
        <div class="calhead" style="margin:0">${MESES_NOME[agViewM]} ${agViewY}</div>
        <button id="agNext" aria-label="Próximo">›</button>
      </div>
      <div class="calgrid caldow">${['D','S','T','Q','Q','S','S'].map(x=>`<div class="caldw">${x}</div>`).join('')}</div>
      <div class="calgrid">${cells}</div>
    </div>
    <div style="margin-top:14px">${listHTML}</div>`;

  $('#agPrev').onclick=()=>{ agViewM--; if(agViewM<0){ agViewM=11; agViewY--; } renderAgenda(); };
  $('#agNext').onclick=()=>{ agViewM++; if(agViewM>11){ agViewM=0; agViewY++; } renderAgenda(); };
  $$('#agendaBox [data-agday]').forEach(c=>c.onclick=()=>{
    const list=marks[c.dataset.agday]||[]; if(list.length===1) dataSheet(list[0].id); else if(list.length) diaSheet(list);
  });
  $$('#agendaBox [data-agedit]').forEach(r=>r.onclick=()=>dataSheet(r.dataset.agedit));
}

// segunda-feira (ISO) da semana que contém `iso` — as semanas de treino são Seg→Dom
function mondayOfISO(iso){ const d=new Date(iso+'T00:00:00'); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDiasISO(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
// garante semanas ANCORADAS NA SEGUNDA e que exista a semana de hoje (senão o treino de hoje não teria coluna).
// Também migra dados antigos (que começavam num dia qualquer) pra segunda, pra o rótulo SEG..DOM bater com a data real.
function ensureWeeksCoverToday(){
  const monHoje=mondayOfISO(todayISO());
  if(!S.treinoWeeks||!S.treinoWeeks.length){ S.treinoWeeks=[{id:uid(), startISO:monHoje, exec:{}}]; save('treino:weeks'); return; }
  let changed=false;
  // 1) ancora toda semana na segunda-feira
  S.treinoWeeks.forEach(w=>{ const m=mondayOfISO(w.startISO); if(w.startISO!==m){ w.startISO=m; changed=true; } });
  // 2) ordena e remove semanas duplicadas (mesma segunda)
  const seen={}, uniq=[];
  S.treinoWeeks.slice().sort((a,b)=>a.startISO.localeCompare(b.startISO)).forEach(w=>{ if(!seen[w.startISO]){ seen[w.startISO]=1; uniq.push(w); } });
  if(uniq.length!==S.treinoWeeks.length){ changed=true; }
  S.treinoWeeks=uniq;
  // 3) auto-avança até cobrir a semana de hoje
  let guard=0;
  while(guard++<520){
    const last=S.treinoWeeks[S.treinoWeeks.length-1];
    if(last.startISO>=monHoje) break;
    S.treinoWeeks.push({id:uid(), startISO:addDiasISO(last.startISO,7), exec:{}}); changed=true;
  }
  if(changed) save('treino:weeks');
}

function recordeNumero(v){if(typeof v==='number')return Number.isFinite(v)?v:0;const s=String(v??'').replace(',','.');if(/^\d{1,3}:\d{2}$/.test(s)){const [m,seg]=s.split(':').map(Number);return m+seg/60}return Number(s)||0}
function regraRecorde(rec){
  if(rec.regra==='menor'||rec.regra==='maior')return rec.regra;
  const nome=String(rec.nome||'').toLowerCase(),un=String(rec.unidade||'').toLowerCase();
  const duracao=/(^|\s)(min|minuto|minutos|seg|segundo|segundos|tempo|pace)(\s|$)/.test(un)||/tempo|pace/.test(nome)||String(rec.valor||'').includes(':');
  return duracao&&!/sono/.test(nome)?'menor':'maior';
}
function melhorRecorde(rec){const hist=(rec.hist||[]).length?rec.hist:[{valor:rec.valor}];return hist.reduce((melhor,h)=>regraRecorde(rec)==='menor'?(recordeNumero(h.valor)<recordeNumero(melhor.valor)?h:melhor):(recordeNumero(h.valor)>recordeNumero(melhor.valor)?h:melhor),hist[0]).valor}

function mensagemDiaBloqueado(dia){
  const alvo=DIAS.indexOf(dia), atual=DIAS.indexOf(hojeDia());
  return alvo<atual
    ? '⛔ ACORDA, RECRUTA: esse dia já passou. Resultado atrasado não vale — cumpra a missão de HOJE.'
    : '⛔ SEM ROUBAR ETAPA: esse dia ainda não chegou. Missão só conta no dia certo.';
}
function alertaDiaBloqueado(area){

}
function podeExecutarDia(dia, avisar=true, area=''){

function addTreinoWeek(){

// data ISO do dia `di` (0=seg..6=dom) de uma semana que começa em startISO
function weekDayISO(startISO, di){ const dt=new Date(startISO+'T00:00:00'); dt.setDate(dt.getDate()+di); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
// FONTE DA VERDADE = treino:logs por data. Treinou nesse dia se existe log com essa data.
function treinouNoDia(iso){ return (S.treinoLogs||[]).some(l=>l.dateISO===iso); }
// prova (foto/vídeo) + legenda desse dia: 1º do log com prova, senão da recordação de treino do dia
function provaDoDia(iso){
  const logs=(S.treinoLogs||[]).filter(l=>l.dateISO===iso);
  const cp=logs.find(l=>l.prova); if(cp) return {prova:cp.prova, tipo:cp.provaTipo, legenda:cp.legenda||''};
  const rec=(S.recordacoes||[]).find(r=>r.tipo==='treino' && r.dateISO===iso);
  if(rec) return {prova:rec.url, tipo:rec.midiaTipo, legenda:rec.texto||''};
  const cl=logs.find(l=>l.legenda); return cl?{prova:null,tipo:null,legenda:cl.legenda}:null;
}
function renderTreinoWeeks(){
  const now=brasiliaNow(); now.setHours(0,0,0,0);
  const cwi=currentWeekIndex();
  const edit=!!S.config.editMode;
  if(edit){ renderPlanejamentoSemanas(); return; }
  const atuais=[], futuras=[], passadas=[];
  S.treinoWeeks.forEach((w,i)=>{
    const start=new Date(w.startISO); start.setHours(0,0,0,0);
    const end=new Date(start); end.setDate(end.getDate()+7);
    const future = start>now;
    // dias feitos derivados dos LOGS (não do exec, que podia dessincronizar)
    const diasFeitos = DIAS.map((d,di)=> treinouNoDia(weekDayISO(w.startISO,di)));
    const done = diasFeitos.filter(Boolean).length;
    const locked = !edit && future;
    const concluida = !future && done>=7;            // ✅ SÓ quando treinou os 7 dias
    const encerrada = !future && !concluida && end<=now;   // janela passou mas NÃO fez tudo
    const meta={w,i,start,end,future,locked,diasFeitos,done,concluida,encerrada};
    if(future) futuras.push(meta); else if(end<=now){ if(done>0) passadas.push(meta); } else atuais.push(meta);
  });
  let h='';
  atuais.forEach(({w,i,diasFeitos,done})=>{
    const strip=DIAS.map((d,di)=>{ const ok=diasFeitos[di]; const isToday=d===hojeDia()&&i===cwi;
      return `<div class="wd ${ok?'ok':''} ${isToday?'today':''}"><b>${ok?'✓':(DIAS_AB[d][0])}</b>${DIAS_AB[d]}</div>`; }).join('');
    h+=`<div class="week atual" data-weekview="${i}"><div class="week-head"><h3>Semana ${i+1} • ATUAL</h3><span class="small muted">${done}/7 dias</span></div>
      ${w.descricao?`<div class="week-description">${esc(w.descricao)}</div>`:''}<div class="weekstrip">${strip}</div><div style="padding:2px 14px 12px" class="small muted">Início ${new Date(w.startISO+'T00:00:00').toLocaleDateString('pt-BR')}. Toque para ver tempos, exercícios e comprovações.</div></div>`;
  });
  if(futuras.length) h+=`<div class="weeks-block-title">${edit?'✏️':'🔒'} Próximas semanas${edit?' · LIBERADAS PARA EDIÇÃO':''}</div>`;
  futuras.forEach(({i,start,locked,diasFeitos,done})=>{
    if(edit){
      const strip=DIAS.map((d,di)=>`<div class="wd ${diasFeitos[di]?'ok':''}"><b>${diasFeitos[di]?'✓':DIAS_AB[d][0]}</b>${DIAS_AB[d]}</div>`).join('');
      h+=`<div class="week atual" data-weekview="${i}"><div class="week-head"><h3>Semana ${i+1}</h3><span class="small" style="color:var(--accent2)">✏️ EDITAR</span></div>
        <div class="weekstrip">${strip}</div><div style="padding:2px 14px 12px" class="small muted">Modo edição: semana liberada para preparar a rotina.</div></div>`;
      return;
    }
      const secs=Math.max(0,Math.floor((start-new Date())/1000));
      h+=`<div class="week locked" data-lockedweek="${i}"><div class="week-head"><h3>Semana ${i+1}</h3><span>🔒</span></div>
        <div class="lock-body">
          <div class="chains" aria-hidden="true"><span class="strap s1"></span><span class="strap s2"></span><div class="lockbig">🔒</div></div>
          <div class="esculacho" data-esc="${i}"></div>
          <div class="countdown" data-cd="${start.getTime()}">${fmtDHM(secs)}</div>
        </div></div>`;
  });
  if(passadas.length){
    const rows=[...passadas].reverse().map(({w,i,done,concluida})=>`<button class="week-history-row ${concluida?'perfect':''}" data-weekview="${i}"><span class="wh-status">${concluida?'✓':done}</span><span class="wh-copy"><b>Semana ${i+1}</b><span>${new Date(w.startISO+'T00:00:00').toLocaleDateString('pt-BR')} · ${concluida?'concluída':'encerrada'}</span></span><span class="wh-score">${done}/7 ›</span></button>`).join('');
    h+=`<details class="week-history"><summary><span class="hist-ico">🕘</span><span>Histórico de semanas</span><span class="hist-count">${passadas.length}</span></summary><div class="week-history-list">${rows}</div></details>`;
  }
  $('#treinoWeeks').innerHTML=h;
  $$('#treinoWeeks [data-lockedweek]').forEach(el=> el.onclick=()=>esculachoTravada(el, +el.dataset.lockedweek));
  $$('#treinoWeeks [data-weekview]').forEach(el=> el.onclick=()=>{
    const i=+el.dataset.weekview;
    if(S.config.editMode){
      treinoSemanaSel=i;
      $$('#treinoDays .day').forEach(x=>x.classList.toggle('sel',x.dataset.d===treinoDiaSel));
      renderTreinoDia();
      $('#treinoDia')?.scrollIntoView({behavior:'smooth',block:'center'});
      toast(`Semana ${i+1} selecionada para edição.`);
    } else weekProgressSheet(i);
  });
  clearInterval(window._cdTimer); window._cdTimer=setInterval(updateCountdowns,1000);
}
