<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a0d">
<link rel="manifest" href="manifest.json">
<title>DISCIPLINA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TEMA / VARIÁVEIS  (o tema troca --bg,--bg2,--accent,--accent2)
============================================================ */
:root{
  --bg:#0e1013; --bg2:#0e1013; --surface:#171a20; --surface2:#1d212a;
  --accent:#ff4b4b; --accent2:#ff6b6b; --text:#f3f5f8; --text-dim:#98a1ae;
  --line:rgba(255,255,255,.07); --ok:#37d67a; --warn:#ffb300; --danger:#ff5a5a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);
  background:
    radial-gradient(120% 55% at 50% 0, color-mix(in srgb,var(--accent) 12%, transparent), transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  min-height:100vh; font-size:16.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.display{font-family:'Inter',sans-serif; font-weight:800; letter-spacing:-.01em;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
h1,h2,h3,h4{font-family:'Inter',system-ui,sans-serif; font-weight:800; letter-spacing:-.01em; margin:0; color:var(--text);}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:16px;}
img{max-width:100%;}
a{color:var(--accent2);}

/* ============================================================
   ESTRUTURA GERAL — Modelo C "Atleta"
============================================================ */
#app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:104px;}
.screen{display:none; padding:0 16px;}
.screen.active{display:block; animation:fade .2s ease;}
@keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

/* Topo neutro (todas as páginas menos Início) */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 4px 12px; position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg, var(--bg) 65%, transparent);
  backdrop-filter:blur(8px);
}
.brand{font-weight:800; font-size:20px; letter-spacing:-.01em;}
.brand .dot{color:var(--accent);}
.clock{font-weight:700; font-size:16px; color:var(--text-dim); font-variant-numeric:tabular-nums; text-align:right; line-height:1;}
.clock small{color:var(--text-dim); font-size:11px; margin-left:3px; font-weight:600;}

/* Cabeçalho do Início — hero card com anel de progresso */
.home-top{padding:16px 4px 4px;}
.home-topline{display:flex; align-items:center; justify-content:space-between;}
.herocard{display:flex; gap:16px; align-items:center; background:linear-gradient(150deg,var(--surface2),var(--surface)); border-radius:22px; padding:18px; margin-top:12px; border:1px solid var(--line); box-shadow:0 16px 36px -18px rgba(0,0,0,.7);}
.ring{width:86px; height:86px; flex:0 0 86px; border-radius:50%; display:grid; place-items:center;}
.ring .ring-inner{width:72px; height:72px; border-radius:50%; overflow:hidden; background:var(--surface); display:grid; place-items:center; font-weight:800; font-size:27px;}
.ring .ring-inner img{width:100%; height:100%; object-fit:cover;}
.hero-name{font-weight:800; font-size:23px; line-height:1; letter-spacing:-.01em;}
.hero-user{color:var(--text-dim); font-size:13px; margin-top:5px;}
.pill{display:inline-flex; align-items:center; gap:6px; margin-top:11px; background:color-mix(in srgb,var(--accent) 16%, transparent); color:var(--accent2); font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px;}
.biorow{display:flex; gap:10px; margin:14px 0 2px;}
.biocard{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px 8px; text-align:center;}
.biocard b{font-size:19px; font-weight:800; display:block;}
.biocard s{font-size:10px; text-decoration:none; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}

/* Avatar (ranking / feed / perfil) */
.avatar{width:84px; height:84px; border-radius:20px; object-fit:cover; flex:0 0 84px; background:var(--surface2);}
.avatar.sm{width:46px; height:46px; border-radius:13px; flex-basis:46px;}
.avatar.xs{width:40px; height:40px; border-radius:12px; flex-basis:40px;}

/* Patente / insígnia (perfil) */
.patente-row{display:flex; align-items:center; gap:14px; margin:14px 0 4px; padding:16px; border-radius:20px;
  background:linear-gradient(150deg,var(--surface2),var(--surface)); border:1px solid var(--line); box-shadow:0 14px 32px -20px rgba(0,0,0,.6);}
.insignia{width:38px; height:68px; flex:0 0 38px;}
.insignia.sm{width:23px; height:41px; flex-basis:23px;}
.patente-name{font-weight:800; font-size:19px; color:var(--text);}
.xpbar{height:8px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; margin-top:9px;}
.xpbar>i{display:block; height:100%; border-radius:99px; background:var(--ok);}
.xp-label{font-size:12.5px; color:var(--text-dim); margin-top:7px;}

/* Cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin:12px 0; box-shadow:0 12px 28px -22px rgba(0,0,0,.6);}
.card h2{font-weight:800; font-size:18px;}
.section-title{font-weight:800; font-size:15px; color:var(--text-dim); margin:22px 2px 12px; letter-spacing:.01em;}
.card .h{font-size:12.5px; color:var(--text-dim); font-weight:700; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
.muted{color:var(--text-dim);}
.small{font-size:14px;}

/* Cards de resumo do Início (com ícone + progresso) */
.sumgrid{display:grid; gap:10px;}
.sumcard{display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px 15px;}
.sumcard .ic{width:40px; height:40px; flex:0 0 40px; border-radius:13px; background:color-mix(in srgb,var(--accent) 12%, transparent); display:grid; place-items:center;}
.sumcard .ic svg{width:20px; height:20px; stroke:var(--accent); fill:none; stroke-width:1.9;}
.sumcard .g{flex:1; min-width:0;}
.sumcard .g .t{font-size:12px; color:var(--text-dim);}
.sumcard .g .v{font-weight:800; font-size:16px;}
.sumcard .prog{width:52px; height:6px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; flex:0 0 52px;}
.sumcard .prog i{display:block; height:100%; background:var(--ok);}

/* Botões */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px;
  padding:15px 18px; font-weight:700; font-size:15.5px; letter-spacing:.01em;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; width:100%;
  box-shadow:0 12px 26px -14px color-mix(in srgb,var(--accent) 75%, transparent);}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent; border:1.5px solid var(--line); color:var(--text); box-shadow:none;}
.btn.sm{width:auto; padding:9px 15px; font-size:13px; border-radius:11px;}
.btn.ok{background:linear-gradient(135deg,#1f9e57,var(--ok)); box-shadow:none;}
.btn:disabled{opacity:.45;}

/* Inputs */
.field{margin:14px 0;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px; font-weight:700;}
.field input, .field textarea, .field select{
  width:100%; background:#0c0d11; border:1.5px solid var(--line); border-radius:14px;
  padding:14px; color:var(--text); outline:none;}
.field input:focus, .field textarea:focus{border-color:var(--accent);}
textarea.auto{resize:none; overflow:hidden; min-height:48px;}
.err{color:var(--danger); font-size:13.5px; margin-top:6px; min-height:1px;}

/* Planilha / linhas com check */
.rowitem{display:flex; align-items:center; gap:13px; padding:14px; border:1px solid var(--line); border-radius:16px; margin:10px 0; background:var(--surface);}
.rowitem .chk{width:30px; height:30px; border-radius:10px; border:2px solid var(--line); flex:0 0 30px; display:flex; align-items:center; justify-content:center; font-size:17px; color:#fff;}
.rowitem.done{border-color:var(--ok); background:color-mix(in srgb,var(--ok) 8%, var(--surface));}
.rowitem.done .chk{background:var(--ok); border-color:var(--ok);}
.rowitem .txt{flex:1; min-width:0;}
.rowitem .txt .t{font-weight:700; font-size:15.5px;}
.rowitem .txt .s{font-size:13px; color:var(--text-dim);}
.pencil{opacity:.8; font-size:16px; padding:6px 9px; border-radius:10px; background:rgba(255,255,255,.05); border:1px solid var(--line);}

/* Dias da semana */
.days{display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; scrollbar-width:none;}
.days::-webkit-scrollbar{display:none;}
.day{flex:0 0 auto; min-width:62px; text-align:center; padding:12px 10px; border-radius:16px; border:1px solid var(--line); background:var(--surface);}
.day.sel{border-color:transparent; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;}
.day.today{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%, transparent);}
.day .dn{font-weight:800; font-size:14px;}
.day .dd{font-size:10.5px; color:var(--text-dim);}
.day.sel .dd{color:rgba(255,255,255,.85);}

/* Semana travada */
.week{border:1px solid var(--line); border-radius:18px; margin:12px 0; overflow:hidden; background:var(--surface);}
.week-head{display:flex; justify-content:space-between; align-items:center; padding:15px 16px;}
.week-head h3{font-weight:800; font-size:16px;}
.week.locked{opacity:1;}
.lock-body{padding:20px 16px; text-align:center; background:color-mix(in srgb,var(--accent) 6%, transparent);}
.lock-body .lockico{font-size:32px;}
.esculacho{font-weight:800; font-size:15.5px; color:var(--accent2); margin:8px 0; line-height:1.4;}
.countdown{font-weight:800; font-variant-numeric:tabular-nums; font-size:19px; color:var(--text);}

/* Ranking batalha */
.leader{display:flex; align-items:center; gap:12px; padding:13px; border:1px solid var(--line); border-radius:16px; margin:10px 0; background:var(--surface);}
.leader .pos{font-weight:800; font-size:20px; width:24px; text-align:center; color:var(--text-dim);}
.leader .who{flex:1; min-width:0;}
.leader .who .n{font-weight:800; font-size:16px;}
.leader .who .u{font-size:12.5px; color:var(--text-dim);}
.leader .xp{font-weight:800; color:var(--accent2); font-variant-numeric:tabular-nums;}

/* Feed */
.post{border:1px solid var(--line); border-radius:20px; overflow:hidden; margin:14px 0; background:var(--surface);}
.post-top{display:flex; align-items:center; gap:10px; padding:13px;}
.post-top .n{font-weight:800; font-size:15px;}
.post-top .t{font-size:12px; color:var(--text-dim);}
.post-media{width:100%; max-height:440px; object-fit:cover; display:block; background:#000;}
.post-body{padding:13px;}
.post-actions{display:flex; gap:18px; padding:2px 13px 14px; color:var(--text-dim); font-size:15px;}
.post-actions b{color:var(--text);}

/* Bottom nav (7 itens) */
.nav{position:fixed; bottom:0; left:0; right:0; z-index:40; background:rgba(14,16,19,.92); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding:8px 0 calc(8px + env(safe-area-inset-bottom));}
.nav-inner{max-width:520px; margin:0 auto; display:flex; justify-content:space-between; padding:0 6px;}
.nav button{background:none; border:none; color:var(--text-dim); flex:1; padding:7px 2px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:9.5px; font-weight:700; border-radius:12px;}
.nav button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8;}
.nav button.active{color:var(--accent);}

/* Overlay genérico (sheet) */
.overlay{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.62); display:none; align-items:flex-end;}
.overlay.show{display:flex;}
.sheet{background:var(--surface); width:100%; max-width:520px; margin:0 auto; border-radius:26px 26px 0 0; padding:20px 16px calc(24px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto; box-shadow:0 -24px 54px rgba(0,0,0,.5);}
.sheet h3{font-weight:800; font-size:20px; margin-bottom:6px;}
.sheet-close{float:right; background:rgba(255,255,255,.06); border:none; color:var(--text-dim); font-size:19px; line-height:1; width:32px; height:32px; border-radius:50%;}

/* CRONÔMETRO FULLSCREEN dedicado */
#timer{position:fixed; inset:0; z-index:80; background:radial-gradient(120% 70% at 50% 0, #14171d, #0a0b0e); display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px;}
#timer.show{display:flex;}
#timer .tt{font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.12em; color:var(--accent2);}
#timer .clockbig{font-weight:800; font-variant-numeric:tabular-nums; font-size:76px; margin:12px 0; letter-spacing:-.02em;}
#timer .paused-info{color:var(--text-dim); font-size:15px; margin-bottom:20px; font-variant-numeric:tabular-nums;}
#timer .taunt{font-weight:800; font-size:19px; color:var(--accent2); line-height:1.35; max-width:420px; margin:18px 0 26px; min-height:60px;}
#timer .row{display:flex; gap:12px; width:100%; max-width:420px;}
#timer .row .btn{flex:1;}

/* Toast */
#toast{position:fixed; bottom:114px; left:50%; transform:translateX(-50%) translateY(20px); background:#1b1f27; border:1px solid var(--line);
  color:var(--text); padding:13px 18px; border-radius:14px; font-size:14.5px; opacity:0; transition:.25s; z-index:100; pointer-events:none; max-width:90%; text-align:center; box-shadow:0 14px 34px rgba(0,0,0,.5);}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* Auth */
#auth{max-width:440px; margin:0 auto; padding:0 20px; min-height:100vh; display:flex; flex-direction:column; justify-content:center;}
.emblema{width:110px; height:110px; margin:0 auto 6px; display:block;}
.auth-title{font-weight:800; font-size:34px; text-align:center; letter-spacing:-.01em;}
.auth-sub{text-align:center; color:var(--text-dim); margin:4px 0 24px; font-size:15px;}
.tabs{display:flex; gap:8px; margin-bottom:16px;}
.tabs button{flex:1; padding:13px; border-radius:14px; border:1px solid var(--line); background:transparent; color:var(--text-dim); font-weight:700; font-size:15px;}
.tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent;}
.stepper{display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:18px; color:var(--text-dim); font-size:13px; font-weight:700;}
.stepper .dotstep{width:28px; height:28px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:800;}
.stepper .dotstep.on{background:var(--accent); border-color:var(--accent); color:#fff;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.chip{display:inline-block; padding:5px 11px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid var(--line);}
.chip.bom{color:#8ff0b0; border-color:#2f7d4f;}
.chip.ruim{color:#ff9a9a; border-color:#8a3030;}
.chip.neutro{color:var(--text-dim);}

/* Temas grid */
.themes{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.theme-card{border-radius:18px; padding:14px; border:2px solid transparent; cursor:pointer; position:relative; min-height:82px; display:flex; flex-direction:column; justify-content:flex-end;}
.theme-card .tn{font-weight:800; font-size:15px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.7);}
.theme-card.sel{border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.14);}
.theme-card .check{position:absolute; top:8px; right:8px; font-size:16px;}

.report-bars{display:flex; align-items:flex-end; gap:6px; height:130px; padding-top:8px;}
.report-bars .bar{flex:1; background:linear-gradient(180deg,var(--accent2),var(--accent)); border-radius:8px 8px 0 0; min-height:3px; position:relative;}
.report-bars .bar span{position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:10px; color:var(--text-dim);}
.report-bars .bar b{position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:10px; color:var(--text); font-variant-numeric:tabular-nums;}
.seg{display:flex; gap:6px; margin:8px 0;}
.seg button{flex:1; padding:9px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--text-dim); font-size:12.5px; font-weight:700;}
.seg button.on{background:var(--accent); color:#fff; border-color:var(--accent);}
.hidden{display:none !important;}

/* ============================================================
   RESPONSIVO — tablet / desktop / TV
   No celular: nav inferior. A partir de 900px: nav vira barra
   lateral e o conteúdo ganha respiro; resumo em 2 colunas.
============================================================ */
@media (min-width:900px){
  .nav{top:0; bottom:0; left:0; right:auto; width:108px; height:100vh; border-top:none; border-right:1px solid var(--line); padding:18px 0;}
  .nav-inner{flex-direction:column; height:100%; justify-content:flex-start; gap:6px; padding:0 10px; max-width:none;}
  .nav button{flex:0 0 auto; width:100%; padding:12px 4px; font-size:10.5px;}
  .nav button.active{background:color-mix(in srgb,var(--accent) 14%, transparent);}
  #app{max-width:880px; margin:0 auto; padding-left:108px; padding-bottom:44px;}
  .screen{padding:0 30px;}
  .sumgrid{grid-template-columns:1fr 1fr;}
}
@media (min-width:1280px){
  #app{max-width:1120px;}
  .screen{padding:0 48px;}
  .themes{grid-template-columns:repeat(4,1fr);}
}
@media (min-width:1700px){
  #app{max-width:1360px;}
  body{font-size:18px;}
  .hero-name{font-size:27px;}
}
</style>
</head>
<body>

<!-- sprite de ícones (linha, estilo Modelo C) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></symbol>
 <symbol id="i-treino" viewBox="0 0 24 24"><path d="M4 9v6M20 9v6M7 7v10M17 7v10M7 12h10"/></symbol>
 <symbol id="i-alim" viewBox="0 0 24 24"><path d="M6 3v8a2 2 0 004 0V3M8 11v10M18 3c-2 0-3 3-3 6s1 4 3 4v8"/></symbol>
 <symbol id="i-estudo" viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM19 3v18"/></symbol>
 <symbol id="i-rotina" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></symbol>
 <symbol id="i-batalha" viewBox="0 0 24 24"><path d="M14 3l7 7-3 3-7-7zM10 21l-7-7 3-3 7 7zM5 19l2 2M16 5l3-3"/></symbol>
 <symbol id="i-perfil" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
</svg>

<!-- ===================== AUTH ===================== -->
<div id="auth">
  <div id="authInner"></div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <!-- Início -->
  <section id="scr-inicio" class="screen"></section>
  <section id="scr-treinos" class="screen"></section>
  <section id="scr-alimentacao" class="screen"></section>
  <section id="scr-estudos" class="screen"></section>
  <section id="scr-rotina" class="screen"></section>
  <section id="scr-batalha" class="screen"></section>
  <section id="scr-perfil" class="screen"></section>

  <nav class="nav"><div class="nav-inner" id="navInner"></div></nav>
</div>

<!-- Sheet genérico -->
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<!-- Cronômetro fullscreen dedicado -->
<div id="timer">
  <div class="tt" id="timerTitle">SESSÃO</div>
  <div class="clockbig mono" id="timerClock">00:00:00</div>
  <div class="paused-info" id="timerPaused">Pausado: 00:00:00</div>
  <div class="taunt" id="timerTaunt"></div>
  <div class="row">
    <button class="btn ghost" id="timerPauseBtn">Pausar</button>
    <button class="btn ok" id="timerFinishBtn">Finalizar</button>
  </div>
</div>

<div id="toast"></div>

<!-- inputs de mídia escondidos -->
<input type="file" id="capPhoto" accept="image/*" capture="environment" class="hidden">
<input type="file" id="capVideo" accept="video/*" capture="environment" class="hidden">
<input type="file" id="capGallery" accept="image/*" class="hidden">

<script>
/* ==========================================================================
   DISCIPLINA v3 — standalone (localStorage). Camada de dados isolada em Store,
   pronta pra trocar por Supabase depois sem reescrever o app.
========================================================================== */

/* ---------- API (backend Node + PostgreSQL na VM) ---------- */
const API_BASE = location.pathname.includes('/rotina') ? '/rotina/api' : 'https://redsystems.ddns.net/rotina/api';
let authToken = localStorage.getItem('disc:token') || null;
function setToken(t){ authToken=t; if(t) localStorage.setItem('disc:token',t); else localStorage.removeItem('disc:token'); }
async function api(path,{method='GET',body,auth=true}={}){
  const headers={}; if(body!==undefined) headers['Content-Type']='application/json';
  if(auth && authToken) headers['Authorization']='Bearer '+authToken;
  const res=await fetch(API_BASE+path,{method,headers,body:body!==undefined?JSON.stringify(body):undefined});
  const txt=await res.text(); let data=null; try{ data=txt?JSON.parse(txt):null; }catch{ data=txt; }
  if(!res.ok){ const e=new Error((data&&data.erro)||('HTTP '+res.status)); e.status=res.status; e.data=data; throw e; }
  return data;
}
async function uploadMedia(file){
  const fd=new FormData(); fd.append('arquivo',file);
  const res=await fetch(API_BASE+'/upload',{method:'POST',headers:authToken?{'Authorization':'Bearer '+authToken}:{},body:fd});
  if(!res.ok) throw new Error('Falha no upload'); return res.json(); // {url,tipo}
}

/* ---------- CRYPTO (PBKDF2 + salt — código do Felipe) ---------- */
const bufferToHex = b => Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
const hexToBuffer = h => new Uint8Array(h.match(/.{1,2}/g).map(b=>parseInt(b,16)));
async function hashPassword(password, existingSaltHex=null){
  const enc=new TextEncoder(); const pwBuf=enc.encode(password);
  const salt = existingSaltHex ? hexToBuffer(existingSaltHex) : crypto.getRandomValues(new Uint8Array(16));
  const km = await crypto.subtle.importKey('raw', pwBuf, 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, km, 256);
  return { hashHex: bufferToHex(bits), saltHex: bufferToHex(salt) };
}

/* ---------- COMPRESSÃO DE IMAGEM (canvas, antes de qualquer upload) ---------- */
function compressImage(file, maxSize=1000, quality=0.72){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{ const img=new Image(); img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } }
      else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',quality));
    }; img.onerror=rej; img.src=e.target.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------------------------
   SISTEMA DE INSÍGNIAS SVG — inspirado na graduação de praças do Exército BR
   (divisas em "V" douradas sobre patch escuro; estrela pra graduação de sargento).
   Arte original — não reproduz brasão/insígnia oficial protegida.
   Progressão:  Recruta (patch limpo) → Soldado (1 divisa) → Cabo (2 divisas)
                → 3º Sargento (3 divisas + estrela).
--------------------------------------------------------------------------- */
function insignia(rankId, cls='insignia'){
  const r = RANKS.find(x=>x.id===rankId)||RANKS[0];
  const n = r.divisas; // 0=Recruta, 1=Soldado, 2=Cabo, 3=3º Sargento
  // divisas brancas em "V" sobre patch verde (padrão graduação de praça EB)
  let chevrons='';
  const x1=4.5, cx=19, x2=33.5, arm=9, gap=11, center=40; // viewBox 38x68
  for(let i=0;i<n;i++){
    const ay = center + ((n-1)/2 - i)*gap; // apex, grupo no terço inferior
    chevrons += `<path d="M${x1} ${ay+arm} L${cx} ${ay} L${x2} ${ay+arm}" fill="none" stroke="#fbfdfa" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>`;
  }
  return `<svg class="${cls}" viewBox="0 0 38 68" xmlns="http://www.w3.org/2000/svg">
    <rect x="1.4" y="1.4" width="35.2" height="65.2" rx="1.5" fill="#35512e" stroke="#1f3a1b" stroke-width="1"/>
    <rect x="3.6" y="3.6" width="30.8" height="60.8" rx="1" fill="none" stroke="#eef3ea" stroke-width="1.1"/>
    ${chevrons}
  </svg>`;
}

let S = null;            // dados do usuário logado (perfil + tudo)
let currentUser = null;  // username

const DEFAULT_TREINO_TEMPLATE = ()=>({ seg:[], ter:[], qua:[], qui:[], sex:[], sab:[], dom:[] });

async function loadUserData(){
  const me = await api('/auth/me');            // { usuario, xp, patente }
  const st = await api('/state');              // { chave: valor, ... }
  const u = me.usuario;
  const g = (k,d)=> st[k]!==undefined && st[k]!==null ? st[k] : d;
  S = {
    profile: { id:u.id, nome:u.nomeGuerra, username:u.username, email:u.email, foto:u.fotoUrl,
               idade:u.idade, peso:u.pesoKg, altura:u.alturaCm, metaAgua:u.metaAgua, tema:u.tema, xpBonus:0 },
    treinoTemplate: g('treino:tpl', DEFAULT_TREINO_TEMPLATE()),
    treinoWeeks:    g('treino:weeks', null),
    treinoLogs:     g('treino:logs', []),
    materias:       g('estudo:materias', []),
    estudoSemana:   g('estudo:semana', DEFAULT_TREINO_TEMPLATE()),
    estudoLogs:     g('estudo:logs', []),
    alimSemana:     g('alim:semana', DEFAULT_TREINO_TEMPLATE()),
    pesos:          g('alim:pesos', []),
    agua:           g('alim:agua', {}),
    rotina:         g('rotina', []),
    config:         g('config', {editMode:false, tryHard:false, notif:false}),
  };
  if(!S.treinoWeeks){ S.treinoWeeks = [{ id:uid(), startISO:todayISO(), exec:{} }]; await save('treino:weeks'); }
  currentUser = u.username;
  applyTheme(S.profile.tema||'red');
}
async function saveProfile(){
  const p=S.profile;
  try{ await api('/perfil',{method:'PATCH',body:{ nomeGuerra:p.nome, username:p.username, idade:p.idade,
    pesoKg:p.peso, alturaCm:p.altura, fotoUrl:p.foto, tema:p.tema, metaAgua:p.metaAgua, xp:computeXP() }}); }
  catch(e){ console.error(e); }
}
async function save(k){ await Store.set(k, S[cameMap(k)]); }
function cameMap(k){ return ({'treino:tpl':'treinoTemplate','treino:weeks':'treinoWeeks','treino:logs':'treinoLogs','estudo:materias':'materias','estudo:semana':'estudoSemana','estudo:logs':'estudoLogs','alim:semana':'alimSemana','alim:pesos':'pesos','alim:agua':'agua','rotina':'rotina','config':'config'})[k]; }

/* XP total do usuário = soma de logs + bônus, menos punições. Recalcula. */
function computeXP(){
  let xp=0;
  S.treinoLogs.forEach(l=> xp += Math.floor((l.ativoMs||0)/60000) );          // 1 xp / min treino
  S.estudoLogs.forEach(l=> xp += Math.floor((l.ativoMs||0)/60000)*2 );         // 2 xp / min estudo
  S.estudoLogs.forEach(l=> xp += (l.conteudos?.length||0)*40 );                // 40 xp / conteúdo concluído
  Object.values(S.agua).forEach(v=>{ if(v>=(S.profile.metaAgua||2500)) xp+=15; });
  (S.profile.xpBonus||0) && (xp += S.profile.xpBonus);
  return Math.max(0, xp);
}

function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(e); }

async function signupNext(){
  const email=$('#suEmail').value.trim().toLowerCase(), p=$('#suPass').value, p2=$('#suPass2').value;
  const err=$('#suErr');
  if(!validEmail(email)) return err.textContent='E-mail inválido. Use algo como voce@gmail.com';
  if(p.length<6) return err.textContent='Senha muito curta (mínimo 6).';
  if(p!==p2) return err.textContent='As senhas não conferem.';
  try{ const d=await api('/auth/disponivel?email='+encodeURIComponent(email),{auth:false});
    if(d.email===false) return err.textContent='Esse e-mail já está alistado.'; }catch(e){}
  signupDraft.email=email; signupDraft.pass=p; err.textContent='';
  signupStep=2; renderAuth();
}
async function signupFinish(){
  const err=$('#suErr');
  const nome=$('#suNome').value.trim(), username=$('#suUser').value.trim().toLowerCase().replace(/\s+/g,'_');
  const idade=+$('#suIdade').value, peso=+$('#suPeso').value, altura=+$('#suAltura').value;
  if(!nome) return err.textContent='Informe o nome de guerra.';
  if(!/^[a-z0-9_]{3,20}$/.test(username)) return err.textContent='Username: 3–20 caracteres, letras/números/_';
  if(!idade||idade<10||idade>90) return err.textContent='Idade inválida.';
  if(!peso||peso<30||peso>250) return err.textContent='Peso inválido.';
  if(!altura||altura<120||altura>230) return err.textContent='Altura inválida (em cm).';
  const btn=$('#suFinish'); if(btn){ btn.disabled=true; btn.textContent='Alistando…'; }
  try{
    const r = await api('/auth/cadastro',{auth:false, method:'POST', body:{ email:signupDraft.email, senha:signupDraft.pass, username, nomeGuerra:nome, idade, pesoKg:peso, alturaCm:altura }});

    const f=$('#suFoto').files[0];
    if(f){ try{ const up=await uploadMedia(f); await api('/perfil',{method:'PATCH',body:{fotoUrl:up.url}}); }catch(e){} }
    toast('Alistamento concluído. Bem-vindo à caserna, '+nome+'.');
    await enterApp();
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='Concluir alistamento'; }
    err.textContent = e.status===409 ? (e.data?.erro||'E-mail ou username já cadastrado.') : (e.data?.erro||'Falha no cadastro. Sem conexão?'); }
}
async function doLogin(){

   CRONÔMETRO FULLSCREEN dedicado (listeners fixos — corrige bug do finalizar)
========================================================================= */
let timerSession = null; // {tipo, dia, refId, startedAt, elapsedMs, pausedMs, pausedAt, running}
let timerRAF=null;
function startSession(tipo, dia, refId){
  timerSession = { tipo, dia, refId, startedAt:Date.now(), elapsedMs:0, pausedMs:0, pausedAt:null, running:true };
  const nome = tipo==='treino' ? (S.treinoTemplate[dia].find(x=>x.id===refId)?.nome||'Treino')
                               : (S.materias.find(m=>m.id===refId)?.nome||'Estudo');
  $('#timerTitle').textContent = (tipo==='treino'?'SESSÃO DE TREINO — ':'SESSÃO DE ESTUDO — ')+nome.toUpperCase();
  $('#timerPauseBtn').textContent='Pausar';
  rollTaunt();
  $('#timer').classList.add('show');
  tickTimer();
  clearInterval(window._tauntTimer); window._tauntTimer=setInterval(()=>{ if(!timerSession.running) rollTaunt(); },6000);
}
function rollTaunt(){ const pool = timerSession.tipo==='treino'?ESC_TREINO:ESC_ESTUDO; $('#timerTaunt').textContent = timerSession.running?'':pool[Math.floor((Date.now()/6000)%pool.length)]; }
function tickTimer(){
  cancelAnimationFrame(timerRAF);
  const loop=()=>{
    if(!timerSession){ return; }
    if(timerSession.running){ timerSession.elapsedMs = Date.now()-timerSession.startedAt - timerSession.pausedMs; }
    $('#timerClock').textContent = fmtHMS(timerSession.elapsedMs/1000);
    $('#timerPaused').textContent = 'Tempo pausado: '+fmtHMS(timerSession.pausedMs/1000 + (timerSession.pausedAt?(Date.now()-timerSession.pausedAt)/1000:0));
    timerRAF=requestAnimationFrame(loop);
  }; loop();
}
// listeners anexados UMA vez:
$('#timerPauseBtn').addEventListener('click', ()=>{
  if(!timerSession) return;
  if(timerSession.running){ timerSession.running=false; timerSession.pausedAt=Date.now(); $('#timerPauseBtn').textContent='Retomar'; rollTaunt(); }
  else { timerSession.pausedMs += Date.now()-timerSession.pausedAt; timerSession.pausedAt=null; timerSession.running=true; $('#timerTaunt').textContent=''; $('#timerPauseBtn').textContent='Pausar'; }
});
$('#timerFinishBtn').addEventListener('click', finishSession);
function finishSession(){
  if(!timerSession) return;
  if(!timerSession.running && timerSession.pausedAt){ timerSession.pausedMs+=Date.now()-timerSession.pausedAt; timerSession.pausedAt=null; }
  const ativoMs = Math.max(0, (timerSession.running? Date.now()-timerSession.startedAt-timerSession.pausedMs : timerSession.elapsedMs));
  const sess = {...timerSession, ativoMs};
  cancelAnimationFrame(timerRAF); clearInterval(window._tauntTimer);
  $('#timer').classList.remove('show');
  timerSession=null;
  // pós-sessão: mostrar tempos + pedir comprovação / conteúdos
  if(sess.tipo==='treino') posTreino(sess); else posEstudo(sess);
}

/* Relatório (semanal/mensal/anual) — barras + horas */
let relGran = {estudo:'semana', treino:'semana'};
function renderRelatorio(elId, tipo){
  const logs = tipo==='estudo'?S.estudoLogs:S.treinoLogs;
  const gran = relGran[tipo];
  // agrupa
  const buckets={}; const now=new Date();
  logs.forEach(l=>{
    const d=new Date(l.dateISO); let key;
    if(gran==='semana') key=DIAS_AB[DIAS[(d.getDay()+6)%7]];
    else if(gran==='mes') key=String(d.getDate());
    else key=['J','F','M','A','M','J','J','A','S','O','N','D'][d.getMonth()];
    const min=(l.ativoMs||0)/60000;
    const rot = tipo==='estudo'? (l.materia||'—') : (l.nome||'—');
    buckets[key]=(buckets[key]||0)+min;
  });
  // horas por matéria/exercício
  const porItem={}; logs.forEach(l=>{ const k=tipo==='estudo'?(l.materia||'—'):(l.nome||'—'); porItem[k]=(porItem[k]||0)+(l.ativoMs||0)/60000; });
  const keys=Object.keys(buckets); const max=Math.max(1,...Object.values(buckets));
  const el=$('#'+elId);
  el.innerHTML=`
    <div class="card">
      <div class="seg">
        <button data-g="semana" class="${gran==='semana'?'on':''}">Semanal</button>
        <button data-g="mes" class="${gran==='mes'?'on':''}">Mensal</button>
        <button data-g="ano" class="${gran==='ano'?'on':''}">Anual</button>
      </div>
      ${keys.length?`<div class="report-bars">${keys.map(k=>`<div class="bar" style="height:${Math.round(buckets[k]/max*110)+3}px"><b>${Math.round(buckets[k])}m</b><span>${k}</span></div>`).join('')}</div>`:'<p class="muted small">Sem sessões ainda. Bora treinar/estudar.</p>'}
      <div style="margin-top:26px">
        <div class="h">Horas por ${tipo==='estudo'?'matéria':'exercício'}</div>
        ${Object.keys(porItem).length?Object.entries(porItem).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(k)}</span><b class="mono">${(v/60).toFixed(1)}h</b></div>`).join(''):'<p class="muted small">—</p>'}
      </div>
    </div>`;
  $$('#'+elId+' .seg button').forEach(b=>b.onclick=()=>{ relGran[tipo]=b.dataset.g; renderRelatorio(elId,tipo); });
}

function renderAlimAnalise(){
  let bom=0,ruim=0,neutro=0,total=0;
  DIAS.forEach(d=>(S.alimSemana[d]||[]).forEach(r=>{ total++; if(r.tipo==='bom')bom++; else if(r.tipo==='ruim')ruim++; else neutro++; }));
  let msg;
  if(total===0) msg='Cadastre suas refeições da semana pra eu analisar.';
  else {
    const pctRuim=Math.round(ruim/total*100), pctBom=Math.round(bom/total*100);
    const dias7=[]; for(let i=0;i<7;i++){ const dt=new Date(); dt.setDate(dt.getDate()-i); dias7.push(S.agua[dt.toISOString().slice(0,10)]||0); }
    const aguaOk=dias7.filter(v=>v>=S.profile.metaAgua).length;
    const partes=[];
    if(pctBom>=60) partes.push('👏 Alimentação sólida: '+pctBom+'% saudável. É assim que se sustenta patente.');
    else if(pctRuim>=40) partes.push('⚠️ '+pctRuim+'% das refeições são ruins/fast-food. Isso derruba seu rendimento no TAF. Corta.');
    else partes.push('Alimentação mediana ('+pctBom+'% boa, '+pctRuim+'% ruim). Dá pra melhorar puxando mais proteína e menos fritura.');
    partes.push(aguaOk>=5?'💧 Hidratação em dia ('+aguaOk+'/7 dias na meta).':'💧 Só '+aguaOk+'/7 dias bateu a meta de água. Bebe mais.');
    msg=partes.join(' ');
  }
  $('#alimAnalise').innerHTML=`<div class="card"><div class="h">Análise (heurística)</div><p style="font-size:15.5px;line-height:1.5">${msg}</p>
    <p class="small muted" style="margin-top:8px">Análise por regras. IA generativa de verdade dando dicas viria depois, via Supabase Edge Function + API de LLM (custo por uso).</p></div>`;
}

function feedPostHTML(post){

  const liked = (post.likes||[]).some(l=>l.usuarioId===meuId);
  const prof={nome:post.usuario?.nomeGuerra||'?', foto:post.usuario?.fotoUrl};
  const nCom = post._count ? post._count.comentarios : 0;
  return `<div class="post" data-post="${post.id}">
    <div class="post-top">${avatarHTML(prof,'avatar xs')}<div><div class="n">${esc(prof.nome)}</div><div class="t">${new Date(post.criadoEm).toLocaleString('pt-BR')}</div></div></div>

async function openComentarios(postId){
  openSheet(`<h3>Comentários</h3>
    <div id="comLista" class="muted small" style="margin-bottom:12px">Carregando…</div>
    <div class="field" style="margin:0 0 10px"><textarea id="comTxt" class="auto" placeholder="Escreve um comentário, soldado..."></textarea></div>
    <button class="btn ok" id="comEnviar">Comentar</button>`);
  const ta=$('#comTxt'); autoGrow(ta); ta.oninput=()=>autoGrow(ta);
  async function carregar(){
    try{ const cs=await api('/batalha/feed/'+postId+'/comentarios');
      $('#comLista').innerHTML = cs.length
        ? cs.map(c=>`<div class="rowitem"><div class="txt"><div class="t">${esc(c.usuario?.nomeGuerra||'—')} <span class="muted" style="font-weight:400">@${esc(c.usuario?.username||'')}</span></div><div class="s" style="color:var(--text)">${esc(c.texto)}</div></div></div>`).join('')
        : '<p class="muted small">Sem comentários ainda. Seja o primeiro.</p>';
    }catch(e){ $('#comLista').innerHTML='<p class="err">Falha ao carregar comentários.</p>'; }
  }
  carregar();
  $('#comEnviar').onclick=async()=>{
    const texto=$('#comTxt').value.trim(); if(!texto) return;
    const btn=$('#comEnviar'); btn.disabled=true;
    try{ await api('/batalha/feed/'+postId+'/comentar',{method:'POST',body:{texto}});
      ta.value=''; autoGrow(ta); await carregar(); if(activeTab==='batalha') renderBatalha(); }
    catch(e){ toast('Falha ao comentar.'); }
    finally{ btn.disabled=false; }
  };
}
function composePost(prefill=''){
  openSheet(`<h3>Nova publicação</h3>
    <div id="postProva"></div>
    <div class="field"><label>Legenda</label><textarea id="postLeg" class="auto" placeholder="Conta o que você fez hoje...">${esc(prefill)}</textarea></div>
    <button class="btn ok" id="postPub">Publicar no feed</button>`);
  const ta=$('#postLeg'); autoGrow(ta); ta.oninput=()=>autoGrow(ta);
  let midiaUrl=null, midiaTipo=null;
  renderProvaPicker($('#postProva'), (url,tipo)=>{ midiaUrl=url; midiaTipo=tipo; });
  $('#postPub').onclick=async()=>{
    const texto=$('#postLeg').value.trim();
    if(!midiaUrl && !texto) return toast('Coloque uma foto/vídeo ou uma legenda.');
    try{ await api('/batalha/feed',{method:'POST',body:{texto, midiaUrl, midiaTipo, tipo:'manual'}});
      closeSheet(); toast('Publicado, soldado.'); renderBatalha(); }
    catch(e){ toast('Falha ao publicar.'); }
  };
}
async function gerarPublicacaoDoDia(){
  const dia=DIAS[(new Date().getDay()+6)%7];
  const treinos=S.treinoLogs.filter(l=>l.dateISO===todayISO()).length;
  const estudoMin=Math.round(S.estudoLogs.filter(l=>l.dateISO===todayISO()).reduce((a,l)=>a+(l.ativoMs||0)/60000,0));
  const rotinaFeita=S.rotina.filter(r=>r.done===todayISO()).length;
  const aguaHoje=S.agua[todayISO()]||0;
  const txt=`Relatório de hoje 🪖\n• Treinos: ${treinos}\n• Estudo: ${estudoMin} min\n• Rotina: ${rotinaFeita}/${S.rotina.length}\n• Água: ${aguaHoje}ml\nRumo à ESA. Sem desculpa.`;
  composePost(txt);
}

let perfilTab='conta';
function renderPerfil(){
  const p=S.profile; const xp=computeXP(); const r=rankOf(xp);
  $('#scr-perfil').innerHTML=`
    ${topbar('PERFIL')}
    <div class="patente-row">
      ${avatarHTML(p,'avatar')}
      <div style="flex:1"><div class="hero-name" style="font-size:24px">${esc(p.nome)}</div>
        <div class="hero-user">@${esc(p.username)}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">${insignia(r.id,'insignia sm')}<span class="patente-name" style="font-size:16px">${r.name}</span></div>
      </div>
    </div>
    <div class="tabs" style="margin:14px 0">
      <button class="${perfilTab==='conta'?'on':''}" data-pt="conta">Minha conta</button>
      <button class="${perfilTab==='config'?'on':''}" data-pt="config">Config</button>
      <button class="${perfilTab==='temas'?'on':''}" data-pt="temas">Temas</button>
    </div>
    <div id="perfilBody"></div>
    <button class="btn ghost" id="logoutBtn" style="margin-top:18px">Sair da conta</button>
  `;
  $$('#scr-perfil [data-pt]').forEach(b=>b.onclick=()=>{ perfilTab=b.dataset.pt; renderPerfil(); });
  $('#logoutBtn').onclick=logout;
  ({conta:renderPerfilConta, config:renderPerfilConfig, temas:renderPerfilTemas})[perfilTab]();
}
function renderPerfilConta(){
  const p=S.profile;
  $('#perfilBody').innerHTML=`
    <div class="card">
      <div class="h">Dados pessoais <button class="pencil" id="trocarFoto">✏️ foto</button></div>
      <div class="field"><label>Nome de guerra</label><input id="pfNome" value="${esc(p.nome)}"></div>
      <div class="field"><label>Username (único)</label><input id="pfUser" value="${esc(p.username)}"></div>
      <div class="field"><label>E-mail</label><input value="${esc(p.email)}" disabled></div>
      <div class="grid2">
        <div class="field"><label>Idade</label><input id="pfIdade" type="number" value="${p.idade}"></div>
        <div class="field"><label>Peso (kg)</label><input id="pfPeso" type="number" value="${p.peso}"></div>
      </div>
      <div class="field"><label>Altura (cm)</label><input id="pfAltura" type="number" value="${p.altura}"></div>
      <div class="err" id="pfErr"></div>
      <button class="btn" id="pfSave">Salvar alterações</button>
    </div>`;
  $('#trocarFoto').onclick=()=>{ const inp=$('#capGallery'); inp.value=''; inp.onchange=async()=>{ const f=inp.files[0]; if(!f)return;
    toast('Enviando foto…');
    try{ const up=await uploadMedia(f); S.profile.foto=up.url; await api('/perfil',{method:'PATCH',body:{fotoUrl:up.url}}); renderPerfil(); toast('Foto atualizada.'); }
    catch(e){ toast('Falha ao enviar a foto.'); } }; inp.click(); };
  $('#pfSave').onclick=async()=>{
    const err=$('#pfErr'); const nome=$('#pfNome').value.trim();
    const username=$('#pfUser').value.trim().toLowerCase().replace(/\s+/g,'_');
    const idade=+$('#pfIdade').value, peso=+$('#pfPeso').value, altura=+$('#pfAltura').value;
    if(!nome) return err.textContent='Nome de guerra vazio.';
    if(!/^[a-z0-9_]{3,20}$/.test(username)) return err.textContent='Username inválido.';
    if(!idade||!peso||!altura) return err.textContent='Preencha idade, peso e altura.';
    try{
      await api('/perfil',{method:'PATCH',body:{ nomeGuerra:nome, username, idade, pesoKg:peso, alturaCm:altura, metaAgua:Math.round(peso*35) }});
      p.nome=nome; p.username=username; p.idade=idade; p.peso=peso; p.altura=altura; p.metaAgua=Math.round(peso*35); currentUser=username;
      err.textContent=''; toast('Dados atualizados.'); renderPerfil();
    }catch(e){ err.textContent = e.status===409 ? 'Esse username já existe.' : (e.data?.erro||'Falha ao salvar.'); }
  };
}

      <div class="h">Modo de edição</div>
      <label class="rowitem"><input type="checkbox" id="cfEdit" ${c.editMode?'checked':''} style="width:24px;height:24px"><div class="txt"><div class="t">Ativar edição</div><div class="s">Mostra o lápis ✏️ pra editar treinos, estudos, refeições, rotina.</div></div></label>
    </div>
    <div class="card">

      <label class="rowitem"><input type="checkbox" id="cfTry" ${c.tryHard?'checked':''} style="width:24px;height:24px"><div class="txt"><div class="t">Modo Try Hard 🔥</div><div class="s">Se você atrasar, o app floda notificação até você agir. Nível ESA.</div></div></label>
      <p class="small muted" style="margin-top:6px">⚠️ Notificação só dispara com o app aberto (limite do navegador). Notificar com o app fechado exige Web Push + servidor — fase futura.</p>
    </div>`;
  $('#cfEdit').onchange=e=>{ S.config.editMode=e.target.checked; save('config'); toast(e.target.checked?'Modo edição ON':'Modo edição OFF'); };
  $('#cfNotif').onchange=async e=>{ S.config.notif=e.target.checked; save('config'); if(e.target.checked && 'Notification' in window){ const perm=await Notification.requestPermission(); if(perm!=='granted'){ toast('Permissão de notificação negada no navegador.'); } } };
  $('#cfTry').onchange=e=>{ S.config.tryHard=e.target.checked; save('config'); startTryHard(); };
}
function renderPerfilTemas(){
  $('#perfilBody').innerHTML=`<div class="card"><div class="h">${THEMES.length} temas — muda o fundo inteiro</div>
    <div class="themes">${THEMES.map(t=>`
      <div class="theme-card ${S.profile.tema===t.id?'sel':''}" data-theme="${t.id}" style="background:linear-gradient(150deg,${t.bg},${t.bg2});border-color:${S.profile.tema===t.id?'#fff':'transparent'}">
        <div class="check">${S.profile.tema===t.id?'✅':''}</div>
        <div style="display:flex;gap:5px;margin-bottom:8px"><span style="width:22px;height:22px;border-radius:6px;background:${t.a}"></span><span style="width:22px;height:22px;border-radius:6px;background:${t.a2}"></span></div>
        <div class="tn">${t.n}</div>
      </div>`).join('')}</div></div>`;
  $$('#perfilBody [data-theme]').forEach(el=>el.onclick=()=>{ S.profile.tema=el.dataset.theme; applyTheme(el.dataset.theme); saveProfile(); renderPerfilTemas(); });
}

/* =========================================================================
   NOTIFICAÇÕES / TRY HARD
========================================================================= */
function notify(title,body){ if('Notification' in window && Notification.permission==='granted'){ try{ new Notification(title,{body, icon:'icon-192.png'}); }catch(e){} } }
function startTryHard(){
  clearInterval(window._tryTimer);
  window._tryTimer=setInterval(()=>{
    if(!S) return;
    const now=brasiliaNow(); const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    // lembrete de hábito no horário exato
    S.rotina.forEach(r=>{ if(r.hora===hhmm && r.done!==todayISO()){ notify('DISCIPLINA — '+r.nome, 'Está no horário. Cumpra agora, recruta.'); } });
    // try hard: hábitos atrasados
    if(S.config.tryHard){
      const atrasados=S.rotina.filter(r=>r.hora && r.hora<hhmm && r.done!==todayISO());
      if(atrasados.length){ notify('🔥 MODO TRY HARD', TRYHARD[Math.floor(now.getMinutes()%TRYHARD.length)]+' ('+atrasados.length+' tarefa(s) atrasada(s))'); }
    }
  }, 60000);
}

function openSheet(html){ $('#sheet').innerHTML=`<button class="sheet-close" onclick="closeSheet()">×</button>`+html; $('#overlay').classList.add('show'); }
function closeSheet(){ $('#overlay').classList.remove('show'); }
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeSheet(); });
window.closeSheet=closeSheet;

/* =========================================================================
   TEMPO REAL (Socket.io) — feed/ranking ao vivo
========================================================================= */
let _socket=null;
function connectSocket(){
  if(_socket || !authToken) return;
  const origin = API_BASE.startsWith('http') ? API_BASE.replace(/\/api$/,'') : location.origin;
  const src = origin + '/socket.io/socket.io.js';
  const boot=()=>{ try{
    _socket = io(origin, { path:'/rotina/socket.io', auth:{ token:authToken }, transports:['websocket','polling'] });
    const refresh=()=>{ if(activeTab==='batalha') renderBatalha(); };
    _socket.on('post:novo', refresh);
    _socket.on('post:like', refresh);
    _socket.on('post:comentario', refresh);
  }catch(e){} };
  if(window.io){ boot(); return; }
  const s=document.createElement('script'); s.src=src; s.onload=boot; s.onerror=()=>{}; document.head.appendChild(s);
}

/* =========================================================================
   BOOT
========================================================================= */
(async function boot(){
  applyTheme('red');
  if(authToken){
    try{ await enterApp(); }
    catch(e){ setToken(null); $('#auth').classList.remove('hidden'); renderAuth(); }
  } else { $('#auth').classList.remove('hidden'); renderAuth(); }
  // registra service worker (só funciona em https/host real; ignora falha local)
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); }
})();
</script>
