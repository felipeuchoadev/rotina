function currentWeekIndex(){ const now=brasiliaNow(); now.setHours(0,0,0,0);
  let idx=0; S.treinoWeeks.forEach((w,i)=>{ const s=new Date(w.startISO); s.setHours(0,0,0,0); if(s<=now) idx=i; }); return idx; }
// semana que CONTÉM hoje (startISO <= hoje < startISO+7); -1 se nenhuma
function weekContainingToday(){ const t=todayISO(); for(let i=0;i<S.treinoWeeks.length;i++){ const s=S.treinoWeeks[i].startISO; const e=new Date(s+'T00:00:00'); e.setDate(e.getDate()+7); const eISO=`${e.getFullYear()}-${String(e.getMonth()+1).padStart(2,'0')}-${String(e.getDate()).padStart(2,'0')}`; if(t>=s && t<eISO) return i; } return -1; }
function fmtDHM(secs){ const d=Math.floor(secs/86400), h=Math.floor(secs%86400/3600), m=Math.floor(secs%3600/60), s=secs%60; return d>0?`${d}d ${h}h ${m}m`:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function updateCountdowns(){ $$('[data-cd]').forEach(el=>{ const secs=Math.max(0,Math.floor((+el.dataset.cd-Date.now())/1000)); el.textContent=fmtDHM(secs); if(secs<=0){ el.textContent='LIBERADA'; renderTreinos(); } }); }

let timerSession = null; // {tipo, dia, refId, startedAt, elapsedMs, pausedMs, pausedAt, running}
let timerRAF=null;
function startSession(tipo, dia, refId){
  timerSession = { tipo, dia, refId, startedAt:Date.now(), elapsedMs:0, pausedMs:0, pausedAt:null, running:true };
  const nome = tipo==='treino' ? (S.treinoTemplate[dia].find(x=>x.id===refId)?.nome||'Treino')
                               : (S.materias.find(m=>m.id===refId)?.nome||'Estudo');
  $('#timerTitle').textContent = (tipo==='treino'?'SESSÃO DE TREINO — ':'SESSÃO DE ESTUDO — ')+nome.toUpperCase();
  $('#timerPauseBtn').textContent='Pausar';
  rollTaunt();
  $('#timer').classList.add('show');
  tickTimer();
  clearInterval(window._tauntTimer); window._tauntTimer=setInterval(()=>{ if(!timerSession.running) rollTaunt(); },6000);
}
function rollTaunt(){ const pool = timerSession.tipo==='treino'?ESC_TREINO:ESC_ESTUDO; $('#timerTaunt').textContent = timerSession.running?'':pool[Math.floor((Date.now()/6000)%pool.length)]; }
function tickTimer(){
  cancelAnimationFrame(timerRAF);
  const loop=()=>{
    if(!timerSession){ return; }
    if(timerSession.running){ timerSession.elapsedMs = Date.now()-timerSession.startedAt - timerSession.pausedMs; }
    $('#timerClock').textContent = fmtHMS(timerSession.elapsedMs/1000);
    $('#timerPaused').textContent = 'Tempo pausado: '+fmtHMS(timerSession.pausedMs/1000 + (timerSession.pausedAt?(Date.now()-timerSession.pausedAt)/1000:0));
    timerRAF=requestAnimationFrame(loop);
  }; loop();
}
// listeners anexados UMA vez:
$('#timerPauseBtn').addEventListener('click', ()=>{
  if(!timerSession) return;
  if(timerSession.running){ timerSession.running=false; timerSession.pausedAt=Date.now(); $('#timerPauseBtn').textContent='Retomar'; rollTaunt(); }
  else { timerSession.pausedMs += Date.now()-timerSession.pausedAt; timerSession.pausedAt=null; timerSession.running=true; $('#timerTaunt').textContent=''; $('#timerPauseBtn').textContent='Pausar'; }
});
$('#timerFinishBtn').addEventListener('click', finishSession);
function finishSession(){
  if(!timerSession) return;
  if(!timerSession.running && timerSession.pausedAt){ timerSession.pausedMs+=Date.now()-timerSession.pausedAt; timerSession.pausedAt=null; }
  const ativoMs = Math.max(0, (timerSession.running? Date.now()-timerSession.startedAt-timerSession.pausedMs : timerSession.elapsedMs));
  const sess = {...timerSession, ativoMs};
  cancelAnimationFrame(timerRAF); clearInterval(window._tauntTimer);
  $('#timer').classList.remove('show');
  timerSession=null;
  // pós-sessão: mostrar tempos + pedir comprovação / conteúdos
  if(sess.tipo==='treino') posTreino(sess); else posEstudo(sess);
}

/* Previsão de término com base no ritmo real (logs de estudo) */
function ritmoDe(logs){
  const concl = logs.reduce((a,l)=>a+(l.conteudos?.length||0),0);
  const ms = logs.reduce((a,l)=>a+(l.ativoMs||0),0);
  const datas = logs.map(l=>l.dateISO).filter(Boolean).sort();
  let span=1;
  if(datas.length){ const d0=new Date(datas[0]), dN=new Date(datas[datas.length-1]); span=Math.max(1, Math.round((dN-d0)/86400000)+1); }
  return { concl, ms, span, avgMs: concl?ms/concl:0, porDia: concl/span };
}
function previsaoMateria(m){
  const conts=m.conteudos||[]; const total=conts.length, done=conts.filter(c=>c.done).length, rest=total-done;
  const r=ritmoDe(S.estudoLogs.filter(l=>String(l.materiaId)===String(m.id)));
  const restMin = r.avgMs? Math.round(r.avgMs*rest/60000):0;
  let etaData=null, etaDias=null;
  if(rest>0 && r.concl>=2 && r.porDia>0){ etaDias=Math.ceil(rest/r.porDia); const e=brasiliaNow(); e.setHours(0,0,0,0); e.setDate(e.getDate()+etaDias); etaData=e; }
  return {total,done,rest,restMin,etaData,etaDias};
}
function fmtDataCurta(d){ return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
function fmtHoras(min){ if(!min) return ''; if(min<60) return min+' min'; return (min/60).toFixed(1).replace('.',',')+'h'; }
function renderPrevisaoEstudo(){
  const box=$('#estPrevisao'); if(!box) return;
  const mats=S.materias.filter(m=>(m.conteudos||[]).length);
  if(!mats.length){ box.innerHTML='<p class="muted small">Cadastre matérias e comece a estudar — aqui eu vou prever quando você termina cada uma.</p>'; return; }
  let total=0, totalRest=0;
  mats.forEach(m=>{ const p=previsaoMateria(m); total+=p.total; totalRest+=p.rest; });
  // card compacto e clicável — o detalhe abre num sheet
  box.innerHTML=`<div class="rowitem" id="prevAbrir" style="cursor:pointer"><div style="font-size:22px;width:34px;text-align:center">📈</div>
    <div class="txt"><div class="t">Previsão de conclusão</div><div class="s">Faltam ${totalRest} de ${total} conteúdos · toque pra ver por matéria</div></div>
    <span class="muted" style="font-size:20px">›</span></div>`;
  $('#prevAbrir').onclick=previsaoEstudoSheet;
}

  else if(rGlobal.concl>=2 && rGlobal.porDia>0){ const dias=Math.ceil(totalRest/rGlobal.porDia); const e=brasiliaNow(); e.setHours(0,0,0,0); e.setDate(e.getDate()+dias);

  openSheet(`<h3>📈 Previsão de conclusão</h3>

let relGran = {estudo:'semana', treino:'semana'};
function renderRelatorio(elId, tipo){
  const logs = tipo==='estudo'?S.estudoLogs:S.treinoLogs;

  // agrupa
  const buckets={}; const now=new Date();
  logs.forEach(l=>{
    const d=new Date(l.dateISO); let key;
    if(gran==='semana') key=DIAS_AB[DIAS[(d.getDay()+6)%7]];
    else if(gran==='mes') key=String(d.getDate());
    else key=['J','F','M','A','M','J','J','A','S','O','N','D'][d.getMonth()];
    const min=(l.ativoMs||0)/60000;
    const rot = tipo==='estudo'? (l.materia||'—') : (l.nome||'—');
    buckets[key]=(buckets[key]||0)+min;
  });
  // horas por matéria/exercício
  const porItem={}; logs.forEach(l=>{ const k=tipo==='estudo'?(l.materia||'—'):(l.nome||'—'); porItem[k]=(porItem[k]||0)+(l.ativoMs||0)/60000; });

      </div>
      ${keys.length?`<div class="report-bars">${keys.map(k=>`<div class="bar" style="height:${Math.round(buckets[k]/max*110)+3}px"><b>${Math.round(buckets[k])}m</b><span>${k}</span></div>`).join('')}</div>`:'<p class="muted small">Sem sessões ainda. Bora treinar/estudar.</p>'}
      <div style="margin-top:26px">
        <div class="h">Horas por ${tipo==='estudo'?'matéria':'exercício'}</div>

function weekLabel(iso){ const s=new Date(iso+'T00:00:00'); const e=new Date(s); e.setDate(e.getDate()+6); return `${s.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}–${e.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}`; }
function dataMaisDias(iso,dias){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+dias); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function sincronizarDiaAlimentacao(){ const hoje=todayISO(); if(alimDiaData!==hoje){ alimDiaData=hoje; alimDiaSel=hojeDia(); } if(!S.agua||typeof S.agua!=='object'||Array.isArray(S.agua)) S.agua={}; }
function refeicoesAlimPeriodo(ref=weekStartISO()){
  const fim=dataMaisDias(ref,7), out=[];
  DIAS.forEach(d=>(S.alimSemana[d]||[]).forEach(r=>{ if(r.done&&r.done>=ref&&r.done<fim) out.push({dia:d,nome:r.nome||'Refeição',desc:r.desc||'',done:r.done,qualidade:qualidadeAuto(r)}); }));
  return out;
}
function analiseAlimPeriodo(ref=weekStartISO()){
  const refeicoes=refeicoesAlimPeriodo(ref); let bom=0,ruim=0,neutro=0;
  refeicoes.forEach(r=>{ if(r.qualidade==='bom') bom++; else if(r.qualidade==='ruim') ruim++; else neutro++; });
  const total=refeicoes.length;
  return {total,bom,ruim,neutro,pctBom:total?Math.round(bom/total*100):0,pctRuim:total?Math.round(ruim/total*100):0,refeicoes};
}
function analiseAlimAtual(){ return analiseAlimPeriodo(S.alimHist?.ref||weekStartISO()); }
let _fechandoAlimAuto=false;
async function finalizarSemanaAlimDados(ref,automatico=false){
  if(_fechandoAlimAuto) return false; _fechandoAlimAuto=true;
  try{
    if(!S.alimHist) S.alimHist={ref:null,hist:[]};
    if(!Array.isArray(S.alimHist.hist)) S.alimHist.hist=[];
    const a=analiseAlimPeriodo(ref);
    const jaArquivada=S.alimHist.hist.some(h=>h.weekStartISO===ref);
    if(a.total>0&&!jaArquivada) S.alimHist.hist.push({weekStartISO:ref,...a});
    const wkAtual=weekStartISO(brasiliaNow()), fimAtual=dataMaisDias(wkAtual,7), novaSemana=DEFAULT_TREINO_TEMPLATE();
    DIAS.forEach(d=>{ novaSemana[d]=(S.alimSemana[d]||[]).map(r=>{
      const feitoNestaSemana=automatico&&r.done&&r.done>=wkAtual&&r.done<fimAtual;
      return {...r,done:feitoNestaSemana?r.done:null};
    }); });
    S.alimSemana=novaSemana; S.alimHist.ref=wkAtual; alimPrecisaFechar=false;
    alimDiaData=todayISO(); alimDiaSel=hojeDia();
    await Promise.all([save('alim:semana'),save('alim:hist')]);
    if(automatico) try{ toast(`Semana ${weekLabel(ref)} finalizada automaticamente.`); }catch(e){}
    return true;
  }finally{ _fechandoAlimAuto=false; }
}
async function garantirSemanaAlimAtual(avisar=false){
  const wk=weekStartISO(brasiliaNow());
  if(!S.alimHist) S.alimHist={ref:null,hist:[]};
  if(!Array.isArray(S.alimHist.hist)) S.alimHist.hist=[];
  if(!S.alimHist.ref){ S.alimHist.ref=wk; await save('alim:hist'); return false; }
  if(S.alimHist.ref===wk) return false;
  return finalizarSemanaAlimDados(S.alimHist.ref,avisar);
}

/* Análise automática da refeição pela descrição (o app julga, não o usuário) */
function qualidadeAuto(r){
  const t = ((r.nome||'')+' '+(r.desc||'')).toLowerCase();
  if(!t.trim()) return '';
  const ruim=['fast food','fast-food','hamburg','hambúrg','fritura','batata frita','refrigerante','coca-cola','pizza','sorvete','biscoito recheado','salgadinho','cerveja','bacon','nuggets','miojo','lámen','lamen','pastel','coxinha','frito','fritas'];
  const bom=['frango','ovo','ovos','salada','legume','verdura','arroz integral','feijão','feijao','batata doce','aveia','fruta','banana','maçã','maca','peito','peixe','atum','iogurte','whey','proteína','proteina','brócolis','brocolis','integral','grelhad','cozid'];
  const has=(arr)=>arr.some(w=>t.includes(w));
  if(has(ruim)) return 'ruim';
  if(has(bom)) return 'bom';
  return 'neutro';
}

function renderAlimAnalise(){
  let bom=0,ruim=0,neutro=0,total=0;
  DIAS.forEach(d=>(S.alimSemana[d]||[]).forEach(r=>{ total++; const q=qualidadeAuto(r); if(q==='bom')bom++; else if(q==='ruim')ruim++; else neutro++; }));
  let msg;
  if(total===0) msg='Cadastre suas refeições da semana pra eu analisar.';
  else {
    const pctRuim=Math.round(ruim/total*100), pctBom=Math.round(bom/total*100);
    const dias7=[]; for(let i=0;i<7;i++){ const dt=new Date(); dt.setDate(dt.getDate()-i); dias7.push(S.agua[dt.toISOString().slice(0,10)]||0); }
    const aguaOk=dias7.filter(v=>v>=S.profile.metaAgua).length;
    const partes=[];
    if(pctBom>=60) partes.push('👏 Alimentação sólida: '+pctBom+'% saudável. É assim que se sustenta patente.');
    else if(pctRuim>=40) partes.push('⚠️ '+pctRuim+'% das refeições são ruins/fast-food. Isso derruba seu rendimento no TAF. Corta.');
    else partes.push('Alimentação mediana ('+pctBom+'% boa, '+pctRuim+'% ruim). Dá pra melhorar puxando mais proteína e menos fritura.');
    partes.push(aguaOk>=5?'💧 Hidratação em dia ('+aguaOk+'/7 dias na meta).':'💧 Só '+aguaOk+'/7 dias bateu a meta de água. Bebe mais.');
    msg=partes.join(' ');
  }
  $('#alimAnalise').innerHTML=`<div class="card"><div class="h">Análise da semana</div><p style="font-size:15.5px;line-height:1.5">${msg}</p></div>`;
}

function trocasParaRefeicao(r){
  const t=`${r.nome||''} ${r.desc||''}`.toLowerCase(); const dicas=[];
  const tem=(xs)=>xs.some(x=>t.includes(x));
  if(tem(['refrigerante','coca-cola','coca cola'])) dicas.push('Troque o refrigerante por água com gás e limão, água saborizada ou suco sem açúcar.');
  if(tem(['fritura','frito','fritas','batata frita','pastel','coxinha','nuggets'])) dicas.push('Prefira a versão assada, grelhada ou feita na air fryer e inclua salada ou legumes.');
  if(tem(['hamburg','fast food','fast-food'])) dicas.push('Monte um lanche caseiro com pão integral, carne magra ou frango, queijo em pouca quantidade e salada.');
  if(tem(['pizza'])) dicas.push('Reduza a quantidade e prefira massa fina com frango, atum, vegetais e menos queijo; complete com salada.');
  if(tem(['miojo','lámen','lamen'])) dicas.push('Troque por arroz, macarrão comum ou batata com ovo/frango e legumes; evite o tempero pronto rico em sódio.');
  if(tem(['sorvete','biscoito recheado','salgadinho'])) dicas.push('No lanche, use fruta com iogurte, aveia, castanhas ou pipoca caseira sem excesso de óleo.');
  if(tem(['bacon','linguiça','salsicha'])) dicas.push('Substitua o embutido por ovos, frango, atum ou carne magra para reduzir gordura e sódio.');
  if(tem(['cerveja','álcool','alcool'])) dicas.push('Intercale com água e evite usar bebida alcoólica como parte frequente da rotina alimentar.');
  if(!dicas.length&&r.qualidade==='ruim') dicas.push('Mantenha a mesma refeição, mas reduza ultraprocessados e acrescente proteína magra, legumes e uma fonte de carboidrato simples.');
  if(!dicas.length&&r.qualidade==='neutro') dicas.push('A descrição não permite avaliar bem. Informe os alimentos e tente montar o prato com proteína, carboidrato e vegetais.');
  return [...new Set(dicas)];
}

// status de um dia: sempre usa as mesmas atividades exibidas no calendário
function diaStatusRotina(iso){
  const acts=(S.rotinaDias&&S.rotinaDias[iso])||[];

  return {total:0, done:0};
}
function rotinaDoDia(iso=todayISO()){

let rotCalY=null, rotCalM=null;   // mês/ano em exibição no calendário da rotina
function renderCalendarioRotina(){
  const now=brasiliaNow();
  if(rotCalY==null){ rotCalY=now.getFullYear(); rotCalM=now.getMonth(); }
  const y=rotCalY, mo=rotCalM;
  const startDow=new Date(y,mo,1).getDay(); // 0=domingo
  const dim=new Date(y,mo+1,0).getDate();
  const hoje=todayISO();
  const nomes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="calc empty"></div>';
  for(let d=1; d<=dim; d++){
    const iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const st=diaStatusRotina(iso);
    let cls, content=d;
    if(iso>hoje){ cls='futuro'; if(st.total>0) cls+=' plan'; }                 // futuro: cor do tema
    else if(iso===hoje){ if(st.total>0 && st.done>=st.total){ cls='full'; content='✅'; } else cls='sem'; }
    else { // passado
      if(st.total>0 && st.done>=st.total){ cls='full'; content='✅'; }          // 100%: ✅
      else if(st.total>0){ cls='inc'; content='✕'; }                            // incompleto: X
      else { cls='sem'; }
    }
    if(iso===hoje) cls+=' hoje';
    if(rotClearMode && rotClearSel.has(iso)) cls+=' selc';
    cells+=`<div class="calc ${cls}" data-caldia="${iso}">${content}</div>`;
  }
  $('#rotinaCal').innerHTML=`<div class="calbox">
    <div class="calnav">
      <button id="rotPrev" aria-label="Anterior">‹</button>

      <button id="rotNext" aria-label="Próximo">›</button>

    <div class="calgrid">${cells}</div>
    <div class="callegend"><span><i class="lok"></i>tudo feito ✅</span><span><i class="lfail"></i>incompleto ✕</span><span><i class="lfut"></i>futuro</span></div>
    ${rotClearMode?`<button class="btn" id="rotLimparConfirm" style="margin-top:12px;background:linear-gradient(135deg,var(--accent),var(--accent2))">🗑️ Limpar ${rotClearSel.size} dia(s) selecionado(s)</button>`:''}
  </div>`;
  $('#rotPrev').onclick=()=>{ rotCalM--; if(rotCalM<0){ rotCalM=11; rotCalY--; } renderCalendarioRotina(); };
  $('#rotNext').onclick=()=>{ rotCalM++; if(rotCalM>11){ rotCalM=0; rotCalY++; } renderCalendarioRotina(); };
  $$('#rotinaCal [data-caldia]').forEach(c=>c.onclick=()=>{
    const iso=c.dataset.caldia;
    if(rotClearMode){ if(rotClearSel.has(iso)) rotClearSel.delete(iso); else rotClearSel.add(iso); renderCalendarioRotina(); }
    else diaRotinaSheet(iso);
  });
  if(rotClearMode && $('#rotLimparConfirm')) $('#rotLimparConfirm').onclick=async()=>{
    if(!rotClearSel.size) return toast('Selecione os dias que quer limpar.');

    rotClearSel.forEach(iso=>{ delete S.rotinaDias[iso]; });
    await save('rotina:dias'); const n=rotClearSel.size; rotClearMode=false; rotClearSel=new Set();
    toast(`${n} dia(s) limpo(s).`); renderRotina();
  };
}
function isoDeData(x){ return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
function campoHorario(id,valor=''){
  return `<input id="${id}" type="text" inputmode="numeric" maxlength="5" autocomplete="off" value="${esc(valor)}" placeholder="Ex: 08:00" aria-label="Horário no formato horas e minutos">`;

function normalizarHorario(valor){
  const original=String(valor||'').trim(); if(!original) return '';
  const digitos=original.replace(/\D/g,'');
  let hora='';
  if(/^\d{3}$/.test(digitos)) hora=`0${digitos[0]}:${digitos.slice(1)}`;
  else if(/^\d{4}$/.test(digitos)) hora=`${digitos.slice(0,2)}:${digitos.slice(2)}`;
  else if(/^\d{1,2}:\d{2}$/.test(original)){ const [h,m]=original.split(':'); hora=`${h.padStart(2,'0')}:${m}`; }
  if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(hora)) return null;
  return hora;
}
function ativarCampoHorario(id){
  const el=$('#'+id); if(!el) return;
  el.addEventListener('blur',()=>{ const hora=normalizarHorario(el.value); if(hora!==null) el.value=hora; });
}

function diasDaRepeticao(iso,tipo,n=0){
  const d0=new Date(iso+'T00:00:00'), dias=[];
  if(tipo==='dia') dias.push(d0);
  else if(tipo==='semana'){ const off=(d0.getDay()+6)%7, mon=new Date(d0); mon.setDate(d0.getDate()-off); for(let i=0;i<7;i++){ const x=new Date(mon); x.setDate(mon.getDate()+i); dias.push(x); } }
  else if(tipo==='mes'){ const y=d0.getFullYear(),m=d0.getMonth(),dim=new Date(y,m+1,0).getDate(); for(let dd=1;dd<=dim;dd++) dias.push(new Date(y,m,dd)); }
  else if(tipo==='ano'){ const y=d0.getFullYear(); for(let m=0;m<12;m++){ const dim=new Date(y,m+1,0).getDate(); for(let dd=1;dd<=dim;dd++) dias.push(new Date(y,m,dd)); } }
  else if(tipo==='x') for(let i=0;i<=n;i++){ const x=new Date(d0); x.setDate(d0.getDate()+i); dias.push(x); }
  return dias;
}
function adicionarAtividadeRepetida(iso,atividade,tipo,n=0){

  diasDaRepeticao(iso,tipo,n).forEach(data=>{ const k=isoDeData(data); if(k<hoje&&k!==iso) return; const lista=S.rotinaDias[k]||(S.rotinaDias[k]=[]); const duplicada=lista.some(a=>String(a.nome||'').trim().toLocaleLowerCase('pt-BR')===atividade.nome.trim().toLocaleLowerCase('pt-BR')&&(a.hora||'')===(atividade.hora||'')); if(duplicada) return; lista.push({id:uid(),nome:atividade.nome,hora:atividade.hora,done:false,updatedAt:Date.now()}); count++; });

}

  let rec=null, partes=[], timer=null, inicio=0, blob=null;
  const parar=()=>{ if(rec&&rec.state!=='inactive')rec.stop(); clearInterval(timer); };
  _chatStopRecording=()=>{ parar(); blob=null; $('#chatRecording')?.classList.remove('show'); };
  $('#chatMic').onclick=async()=>{ try{ const stream=await navigator.mediaDevices.getUserMedia({audio:true}); partes=[]; blob=null; rec=new MediaRecorder(stream); rec.ondataavailable=e=>{if(e.data.size)partes.push(e.data)}; rec.onstop=()=>{blob=new Blob(partes,{type:rec.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop())}; rec.start(); inicio=Date.now(); $('#chatRecording').classList.add('show'); timer=setInterval(()=>{const s=Math.floor((Date.now()-inicio)/1000);$('#chatRecTime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250); }catch(e){ toast('Autorize o microfone para gravar áudio.'); } };
  $('#chatRecCancel').onclick=()=>{ parar(); blob=null; $('#chatRecording').classList.remove('show'); };
  $('#chatRecSend').onclick=()=>{ if(!rec)return; rec.addEventListener('stop',async()=>{ $('#chatRecording').classList.remove('show'); if(!blob)return; try{toast('Enviando áudio…');const f=new File([blob],'audio-'+Date.now()+'.webm',{type:blob.type});const up=await uploadMedia(f);await enviar({url:up.url,tipo:'audio'});}catch(e){toast('Falha ao enviar áudio.');} },{once:true}); parar(); };
}

    ${post.texto?`<div class="post-body ${media?'':'post-like-zone'}" ${media?'':`data-double-like="${post.id}" data-liked="${liked?1:0}"`}>${esc(post.texto)}${media?'':'<span class="double-heart">❤️</span>'}</div>`:''}

function postLink(id){
  const base = location.pathname.includes('/rotina') ? (location.origin+'/rotina/') : (location.origin+location.pathname);
  return base + '#post=' + id;
}
async function compartilharPost(id){
  const url=postLink(id);
  try{
    if(navigator.share){ await navigator.share({ title:'REDZONE', text:'Olha essa publicação no REDZONE', url }); return; }
    await navigator.clipboard.writeText(url); toast('Link copiado! 🔗');
  }catch(e){ try{ await navigator.clipboard.writeText(url); toast('Link copiado! 🔗'); }catch(_){ toast(url); } }
}

const _likesBusy=new Set();
function aplicarCurtidaPostDOM(id,curtido,total){
  $$(`[data-like="${id}"]`).forEach(el=>{ if(el.firstChild) el.firstChild.textContent=curtido?'❤️ ':'🤍 '; const n=$('b',el); if(n&&total!=null)n.textContent=total; });
  $$(`[data-double-like="${id}"]`).forEach(el=>el.dataset.liked=curtido?'1':'0');
}
function atualizarTotalComentariosDOM(id,delta=0,total=null){
  $$(`[data-post="${id}"] [data-comment]`).forEach(el=>{ const n=$('b',el); if(n)n.textContent=total==null?Math.max(0,(+n.textContent||0)+delta):total; });

async function alternarCurtidaPost(id){
  id=String(id); if(_likesBusy.has(id)) return; _likesBusy.add(id);
  try{ const r=await api('/batalha/feed/'+id+'/like',{method:'POST'}); aplicarCurtidaPostDOM(id,r.curtido,r.total); }
  catch(e){ toast('Falha ao curtir.'); }
  finally{ _likesBusy.delete(id); }
}
let _feedVideoObserver=null;
function pausarVideosFeed(){ $$('[data-feed-video]').forEach(pausaAutomaticaVideo); }
function pausaAutomaticaVideo(v){ try{ v._rzAutoPause=true; v.pause(); setTimeout(()=>{v._rzAutoPause=false;},0); }catch(e){} }
function bindFeedVideos(){
  if(_feedVideoObserver) _feedVideoObserver.disconnect();
  _feedVideoObserver=new IntersectionObserver(entries=>entries.forEach(e=>{ const v=e.target, emSheet=$('#sheet')?.contains(v); if(e.isIntersecting&&e.intersectionRatio>=.65&&activeTab==='batalha'&&(!$('#overlay').classList.contains('show')||emSheet)){ if(v.dataset.src&&!v.src){v.src=v.dataset.src;v.load();} $$('[data-feed-video]').forEach(o=>{if(o!==v)pausaAutomaticaVideo(o);}); if(!conexaoEconomica()&&v.dataset.userPaused!=='1') v.play().catch(()=>{}); } else pausaAutomaticaVideo(v); }),{threshold:[0,.65,1]});
  $$('[data-feed-video]').forEach(v=>{ v.defaultMuted=false; v.muted=false; v.volume=1; v.addEventListener('pause',()=>{ if(!v._rzAutoPause) v.dataset.userPaused='1'; }); v.addEventListener('play',()=>{ v.dataset.userPaused='0'; }); _feedVideoObserver.observe(v); });
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pausarVideosFeed(); });

function abrirNotifAlvo(n){
  if(!n) return;
  if(n.alvoPostId){ abrirPost(n.alvoPostId,n.alvoCommentId||null); return; }
  if(n.deUsername && n.tipo==='seguidor'){ abrirPerfil(n.deUsername); return; }
  if(n.tipo==='aviso'){ closeSheet(); go('inicio'); return; }
  if(n.deUsername){ abrirPerfil(n.deUsername); return; }
  closeSheet(); go('inicio');
}
// deep-link por hash (usado quando a notificação push abre/foca o app: #post=, #u=, #dm=, #tab=)
function handleDeepLink(){
  const h=location.hash||''; if(h.length<2) return;
  const parts=Object.fromEntries(h.slice(1).split('&').map(kv=>{ const [k,v]=kv.split('='); return [k, decodeURIComponent(v||'')]; }));
  try{
    if(parts.reset){ resetarSenhaSheet(parts.reset); return; }
    if(parts.post){ go('batalha'); abrirPost(parts.post,parts.comment||null); }
    else if(parts.u){ go('batalha'); abrirPerfil(parts.u); }
    else if(parts.dm){ go('batalha'); abrirChat(parts.dm); }
    else if(parts.noti!==undefined){ go('batalha'); setTimeout(abrirNotificacoes,250); }
    else if(parts.tab){ go(parts.tab); }
  }catch(e){}
  history.replaceState(null,'',location.pathname+location.search);
}
function comentariosHTML(cs){
  const porPai=new Map(); cs.forEach(c=>{ const k=c.parentId||0; if(!porPai.has(k)) porPai.set(k,[]); porPai.get(k).push(c); });
  const render=(c,nivel=0)=>{ const liked=(c.likes||[]).some(l=>l.usuarioId===S.profile?.id); const filhos=porPai.get(c.id)||[]; return `<div class="comment-item ${nivel?'reply':''}" data-comment-id="${c.id}">${avatarHTML({nome:c.usuario?.nomeGuerra,foto:c.usuario?.fotoUrl,genero:c.usuario?.genero},'avatar xs')}<div class="comment-body"><div class="t">${esc(c.usuario?.nomeGuerra||'—')} <span class="muted" style="font-weight:400">@${esc(c.usuario?.username||'')}</span></div><div class="comment-text">${esc(c.texto)}</div><div class="comment-actions"><button data-reply-comment="${c.id}" data-reply-name="${esc(c.usuario?.username||c.usuario?.nomeGuerra||'')}">Responder</button><button data-like-comment="${c.id}" aria-label="Curtir comentário">${liked?'❤️':'🤍'} ${(c.likes||[]).length||''}</button><span>${timeago(c.criadoEm)}</span></div></div></div>${filhos.map(f=>render(f,nivel+1)).join('')}`; };
  const roots=porPai.get(0)||cs.filter(c=>c.parentId&&!cs.some(p=>p.id===c.parentId));
  return roots.length?roots.map(c=>render(c)).join(''):'<p class="muted small">Sem comentários ainda. Seja o primeiro.</p>';

async function gerarPublicacaoDoDia(){
  const hoje=todayISO();
  const itens=[];
  const exNames={}; Object.values(S.treinoTemplate||{}).flat().forEach(ex=>{ exNames[ex.id]=ex.nome; });
  // TREINO — entra todo treino de hoje (com ou sem cronômetro)
  const treinoAgg={};
  S.treinoLogs.filter(l=>l.dateISO===hoje).forEach(l=>{ const nome=l.nome||exNames[l.exId]||'Treino'; const m=Math.round((l.ativoMs||0)/60000); treinoAgg[nome]=(treinoAgg[nome]||0)+m; });
  Object.entries(treinoAgg).forEach(([nome,m])=>{ itens.push({txt:`🏋️ Treinei ${nome}${m>0?` — ${m} min`:''}`}); });
  // ESTUDO — entra se teve tempo OU conteúdo concluído
  const estAgg={};
  S.estudoLogs.filter(l=>l.dateISO===hoje).forEach(l=>{ const nome=l.materia||'Matéria'; const a=estAgg[nome]||{min:0,c:0}; a.min+=Math.round((l.ativoMs||0)/60000); a.c+=(l.conteudos?.length||0); estAgg[nome]=a; });
  Object.entries(estAgg).filter(([n,a])=>a.min>0||a.c>0).forEach(([nome,a])=>{ itens.push({txt:`📚 Estudei ${nome}${a.min>0?` — ${a.min} min`:''}${a.c?` (${a.c} conteúdo(s))`:''}`}); });
  // ALIMENTAÇÃO — refeições marcadas como feitas hoje (com a análise automática)
  DIAS.forEach(d=>(S.alimSemana[d]||[]).forEach(r=>{ if(r.done===hoje){ const q=qualidadeAuto(r); itens.push({txt:`🍽️ ${r.nome}${q?` — ${q}`:''}`}); } }));
  // ROTINA — exatamente as atividades concluídas no dia do calendário
  ((S.rotinaDias&&S.rotinaDias[hoje])||[]).filter(a=>a.done).forEach(a=>{ itens.push({txt:`✅ ${a.nome}${a.hora?` (${a.hora})`:''}`}); });
  // ÁGUA
  const agua=S.agua[hoje]||0; if(agua) itens.push({txt:`💧 Bebi ${agua}ml de água`});
  // PESO — se registrou hoje
  const pesoHoje=[...(S.pesos||[])].reverse().find(p=>p.dateISO===hoje); if(pesoHoje) itens.push({txt:`⚖️ Me pesei: ${pesoHoje.peso} kg`});
  const midiasHoje=(S.recordacoes||[]).filter(r=>r.dateISO===hoje);
  if(!itens.length && !midiasHoje.length){ return toast('Nada registrado hoje ainda. Treina/estuda e volta pra gerar.'); }
  openSheet(`<h3>Gerar publicação do dia</h3>
    <p class="small muted">Só o que você REALMENTE fez hoje. Marque o que quer mostrar.</p>
    ${itens.length?itens.map((it,i)=>`<label class="rowitem" style="cursor:pointer"><input type="checkbox" data-gi="${i}" checked style="width:22px;height:22px"><div class="txt"><div class="t" style="font-size:14px">${esc(it.txt)}</div></div></label>`).join(''):'<p class="muted small">Sem atividades de texto hoje.</p>'}
    ${midiasHoje.length?`<div class="section-title" style="margin-top:12px">Anexar uma mídia (opcional)</div>
      <div class="rec-grid" id="giMidias">${midiasHoje.map((m,i)=>`<div class="rec-cell" data-gm="${i}">${m.midiaTipo==='video'?`<video src="${m.url}" muted playsinline></video>`:`<img src="${m.url}">`}<span class="rec-badge" style="right:4px;left:auto">○</span></div>`).join('')}</div>`:''}
    <label class="rowitem" style="cursor:pointer;margin-top:10px"><input type="checkbox" id="giPriv" style="width:22px;height:22px"><div class="txt"><div class="t">Publicação privada 🔒</div></div></label>
    <button class="btn" id="giGerar" style="margin-top:10px">Publicar no feed</button>`);
  const midiasSel=new Set();
  $$('#giMidias [data-gm]').forEach(c=>c.onclick=()=>{const i=+c.dataset.gm;midiasSel.has(i)?midiasSel.delete(i):midiasSel.add(i);$$('#giMidias .rec-cell').forEach(x=>{const on=midiasSel.has(+x.dataset.gm);x.querySelector('.rec-badge').textContent=on?'✓':'○';x.style.outline=on?'3px solid var(--accent)':'none';});});
  $('#giGerar').onclick=async()=>{
    const linhas=itens.filter((it,i)=>$(`[data-gi="${i}"]`)?.checked).map(it=>it.txt);
    const texto = linhas.length?('Relatório de hoje 🪖\n'+linhas.join('\n')+'\n\nRumo à ESA. Sem desculpa.'):'';
    const selecionadas=[...midiasSel].sort((a,b)=>a-b).map(i=>midiasHoje[i]).filter(Boolean), midias=selecionadas.map(m=>({url:m.url,tipo:m.midiaTipo==='video'?'video':'foto'})), primeira=midias[0]||null;
    if(!texto && !midias.length){ return toast('Marque pelo menos uma coisa.'); }
    try{ await api('/batalha/feed',{method:'POST',body:{texto,midias,midiaUrl:primeira?.url||null,midiaTipo:primeira?.tipo||null,tipo:'manual',privado:$('#giPriv').checked}});midias.forEach(m=>_feedPostedUrls.add(m.url));closeSheet();toast(`Publicado, ${rankOf(computeXP()).name}! 📣`);renderBatalha(); }
    catch(e){ toast('Falha ao publicar.'); }
  };
}

let _avisosPendentes=[];

  if(!authToken||S?.profile?.isAdmin||document.querySelector('.system-notice'))return;

function mostrarProximoAviso(){
  if(document.querySelector('.system-notice'))return;const a=_avisosPendentes.shift();if(!a)return;
  const el=document.createElement('div');el.className='system-notice';el.innerHTML=`<div class="system-notice-card"><button class="system-notice-close" aria-label="Fechar aviso">×</button><div class="system-notice-brand">COMUNICADO REDZONE</div><h2>${esc(a.titulo)}</h2><p>${esc(a.mensagem)}</p></div>`;

}

/* =========================================================================
   NOTIFICAÇÕES / TRY HARD
========================================================================= */
function notify(title,body,alvo,comSom){ if(!S?.config?.notif) return; if(comSom) tocarSomNotif(); if('Notification' in window && Notification.permission==='granted'){ try{ const n=new Notification(title,{body, icon:'icon-192.png'}); n.onclick=()=>{ try{ window.focus(); }catch(e){} try{ if(alvo){ if(alvo[0]==='#'){ location.hash=alvo; if(typeof handleDeepLink==='function') handleDeepLink(); } else go(alvo); } }catch(e){} n.close(); }; }catch(e){} } }
function tryOpts(){ if(!S.config.tryOpts) S.config.tryOpts={som:'alarme', vibrar:true, intervaloS:20, treguaS:60, somNotif:true}; return S.config.tryOpts; }
// som que toca em CADA notificação do app (personalizável pela pessoa)
function tocarSomNotif(){ const o=tryOpts(); if(o.somNotif===false) return; if(o.somNotifCustom){ try{ const a=new Audio(o.somNotifCustom); a.volume=1; a.play().catch(()=>{}); }catch(e){} } else { tocarSom('sino'); } }
// motor de som (WebAudio) — sons diferentes; 'alarme' é a sirene chata do Try Hard
let _actx=null; function audioCtx(){ try{ _actx=_actx||new (window.AudioContext||window.webkitAudioContext)(); if(_actx.state==='suspended') _actx.resume(); return _actx; }catch(e){ return null; } }
function tocarSom(tipo){
  const c=audioCtx(); if(!c) return;
  const beeps = tipo==='alarme' ? [ [880,0,.14],[660,.16,.14],[990,.32,.14],[660,.48,.14],[1046,.64,.2] ]
             : tipo==='sino' ? [ [1318,0,.5] ]
             : tipo==='sirene' ? [ [700,0,.5],[1100,.25,.5] ]
             : tipo==='brutal' ? [ [900,0,.16],[1500,.14,.16],[700,.3,.16],[1600,.44,.16],[850,.6,.16],[1700,.74,.2],[600,.94,.26] ] // insuportável
             : [ [880,0,.16] ]; // apito
  const gainV = tipo==='brutal' ? 0.2 : (tipo==='alarme'||tipo==='sirene' ? 0.14 : 0.08);
  beeps.forEach(([f,t,d])=>{ const o=c.createOscillator(), g=c.createGain(); o.type= tipo==='sino'?'sine':'square'; o.frequency.value=f; g.gain.value=gainV; o.connect(g); g.connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+d); });
}
// Try Hard: flash vermelho + tremor da tela + som brutal (2x)
function tryHardFlash(){
  const f=$('#thFlash'); if(f){ f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
  document.body.classList.remove('th-shake'); void document.body.offsetWidth; document.body.classList.add('th-shake');
  setTimeout(()=>document.body.classList.remove('th-shake'),600);
}
function beep(){ tocarSom('apito'); } // compat
// quanto tempo o usuário está continuamente DENTRO do app (pra dar trégua no Try Hard)
let _appActiveSince=Date.now();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') _appActiveSince=Date.now(); });
window.addEventListener('focus',()=>{ _appActiveSince=Date.now(); });
function segsNoApp(){ return document.visibilityState==='visible' ? (Date.now()-_appActiveSince)/1000 : 0; }
// ---- SIRENE incansável do Try Hard (loop de verdade, para só quando cumpre ou dá trégua) ----
let _siren=null, _sirenSrc=null;
function sirenSrcAtual(){ const o=tryOpts(); return o.somCustom || 'siren.mp3'; }
function sirenEl(){ const src=sirenSrcAtual(); if(!_siren || _sirenSrc!==src){ if(_siren){ try{_siren.pause();_siren.currentTime=0;}catch(e){} } _siren=new Audio(src); _siren.loop=true; _siren.preload='auto'; _siren.volume=1.0; _sirenSrc=src; } return _siren; }
function sirenPlay(){ try{ const s=sirenEl(); if(s.paused) s.play().catch(()=>{}); }catch(e){} }
function sirenStop(){ try{ if(_siren && !_siren.paused){ _siren.pause(); _siren.currentTime=0; } }catch(e){} }
// nome "bate" com outro (case-insensitive, um contém o outro) — pra cruzar hábito × treino × estudo
function _nomeBate(a,b){ a=(a||'').trim().toLowerCase(); b=(b||'').trim().toLowerCase(); return !!a && !!b && (a===b || a.includes(b) || b.includes(a)); }
// um item da rotina conta como FEITO hoje se: marcado ✅, OU há treino/estudo equivalente hoje.
// Ex.: correu no treino "Corrida" ⇒ o hábito "Corrida" NÃO cobra mais. (funcional e inteligente, sem cobrar o que já foi feito)
function itemFeitoHoje(nome, doneFlag){
  const hoje=todayISO();
  if(doneFlag===true || doneFlag===hoje) return true;
  if((S.treinoLogs||[]).some(l=>l.dateISO===hoje && _nomeBate(l.nome,nome))) return true;
  if((S.estudoLogs||[]).some(l=>l.dateISO===hoje && _nomeBate(l.materia,nome))) return true;
  return false;
}
// itens COM HORÁRIO que já passaram e ainda NÃO foram feitos hoje (somente o calendário de hoje)
function atrasadosAgora(){
  if(!S) return []; const now=brasiliaNow(); const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'); const hoje=todayISO();
  const out=[];
  ((S.rotinaDias&&S.rotinaDias[hoje])||[]).forEach(a=>{ if(a.hora && a.hora<hhmm && !itemFeitoHoje(a.nome, a.done)) out.push(a.nome); });
  return out;
}
// gerencia a sirene: Try Hard não tem pausa; só para quando não há tarefa atrasada.
function manageSiren(){
  const o=tryOpts();
  if(!S || !S.config.tryHard){ sirenStop(); return; }
  if(atrasadosAgora().length){ sirenPlay(); } else { sirenStop(); }
}
let _tryTick=0, _lastGentle=0;
function startTryHard(){
  clearInterval(window._tryTimer); clearInterval(window._sirenTimer);
  const o=tryOpts();
  window._sirenTimer=setInterval(manageSiren, 2000); manageSiren();
  window._tryTimer=setInterval(()=>{
    if(!S) return;
    const now=brasiliaNow(); const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'); const hoje=todayISO();
    // 1) AVISO no minuto exato do horário das atividades planejadas no calendário de hoje
    if(S.config.notif) ((S.rotinaDias&&S.rotinaDias[hoje])||[]).forEach(a=>{ if(a.hora===hhmm && !itemFeitoHoje(a.nome,a.done)){ notify('REDZONE — '+a.nome, 'Tá no horário. Cumpra agora, recruta.', 'rotina', true); if(o.vibrar&&navigator.vibrate) navigator.vibrate(200); } });
    // 2) TRY HARD BRUTAL (sirene+tremor+esculacho): SÓ pra itens com horário que já PASSOU
    const atrasados=atrasadosAgora();
    if(S.config.tryHard && atrasados.length){
      _tryTick++;
      const nomes = atrasados.slice(0,2).join(', ') + (atrasados.length>2?` +${atrasados.length-2}`:'');
      const abre = ESC_ATRASO[_tryTick % ESC_ATRASO.length];
      const msg = `${abre} PASSOU DO HORÁRIO: ${nomes}. CUMPRE AGORA, RECRUTA!`;
      notify('🔥 MODO TRY HARD', msg, 'rotina');
      if(S.config.notif) api('/push/try-hard',{method:'POST',body:{tarefa:nomes}}).catch(()=>{});
      toast('🔥 '+msg, 4000); tryHardFlash();
      if(navigator.vibrate) navigator.vibrate([400,120,400,120,400,120,600]);
    }
    // 3) LEMBRETE ÚTIL (sem tremor, sem sirene), ~10min: SÓ o que o usuário cadastrou/planejou pra HOJE.
    //    Nada de informação inventada — cada linha vem de um dado real do próprio usuário.
    if(S.config.notif && Date.now()-_lastGentle > 600000 && now.getHours()>=7 && now.getHours()<22){
      // horário decente (7h–22h). Item COM horário só entra depois que o horário chegou — nada de
      // "não deixe de correr (12:00)" às 2 da manhã. Item já feito NUNCA entra.
      const dia=hojeDia();   // 'seg'..'dom' de hoje
      const msgs=[];
      // (a) atividades que VOCÊ marcou pra hoje e ainda não fez (se tem horário, só quando já chegou)
      ((S.rotinaDias&&S.rotinaDias[hoje])||[]).forEach(a=>{ if(a && a.nome && !itemFeitoHoje(a.nome,a.done) && (!a.hora || a.hora<=hhmm)) msgs.push({t:`Não deixe de fazer: ${a.nome}${a.hora?` (${a.hora})`:''}.`, alvo:'rotina'}); });
      // (b) ESTUDO: só as matérias que você AGENDOU pra hoje (estudo por dia da semana) e ainda não estudou
      const estIdsHoje=new Set(S.estudoLogs.filter(l=>l.dateISO===hoje).map(l=>l.materiaId));
      (S.estudoSemana[dia]||[]).forEach(mid=>{ const m=(S.materias||[]).find(x=>x.id===mid); if(m && m.nome && !estIdsHoje.has(mid)) msgs.push({t:`Você planejou estudar ${m.nome} hoje e ainda não abriu. Bora, recruta.`, alvo:'estudos'}); });
      // (c) TREINO: só se há treino MONTADO pra hoje no template e você ainda não treinou
      if((S.treinoTemplate[dia]||[]).length && !S.treinoLogs.some(l=>l.dateISO===hoje)) msgs.push({t:'Você tem treino marcado pra hoje e ainda não fez. Levanta, recruta.', alvo:'treinos'});
      // (d) ÁGUA: só se tem meta definida e está abaixo dela
      if(S.profile.metaAgua>0 && (S.agua[hoje]||0) < S.profile.metaAgua) msgs.push({t:`Falta água pra bater a meta de hoje (${S.agua[hoje]||0}/${S.profile.metaAgua}ml). Hidrata. 💧`, alvo:'alimentacao'});
      if(msgs.length){ _lastGentle=Date.now(); const pick=msgs[Math.floor(Date.now()/600000) % msgs.length]; notify('REDZONE', pick.t, pick.alvo, true); }
    }
  }, Math.max(5,(o.intervaloS||20))*1000);
}

// adiciona o "olho" (mostrar/ocultar) em todo campo de senha dentro de `root`
function bindPasswordEyes(root){
  (root||document).querySelectorAll('input[type=password]:not([data-eye])').forEach(inp=>{
    inp.setAttribute('data-eye','1');
    const wrap=document.createElement('div'); wrap.className='pwwrap';
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
    const btn=document.createElement('button'); btn.type='button'; btn.className='eyebtn'; btn.setAttribute('aria-label','Mostrar senha'); btn.textContent='👁';
    btn.onclick=()=>{ const mostrar=inp.type==='password'; inp.type=mostrar?'text':'password'; btn.textContent=mostrar?'🙈':'👁'; btn.setAttribute('aria-label', mostrar?'Ocultar senha':'Mostrar senha'); try{ inp.focus(); const v=inp.value; inp.value=''; inp.value=v; }catch(e){} };
    wrap.appendChild(btn);
  });
}

/* ENTER global: confirma/avança. Shift+Enter cria nova linha. */
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter' || e.isComposing) return;
  const t=e.target; if(!t) return;
  if(typeof t.onkeydown==='function') return; // tela já possui uma ação Enter específica

  const primary = root=> root && (root.querySelector('[data-enter-primary]') || root.querySelector('.btn:not(.ghost):not([disabled])') || root.querySelector('.btn:not([disabled])'));
  if(t.tagName==='TEXTAREA' && !e.shiftKey){
    const root=inSheet?$('#sheet'):t.closest('.media-preview-box'),b=primary(root);
    if(b){e.preventDefault();b.click();}

  }
  if(t.tagName==='INPUT' && !e.shiftKey){
    if(t.id==='chatTxt') return;

    const root=inSheet?$('#sheet'):(!$('#auth')?.classList.contains('hidden')?$('#authInner'):null);
    const b=primary(root); if(b){ e.preventDefault(); b.click(); }
  }
});

let _socket=null;
function connectSocket(){
  if(_socket || !authToken) return;
  const origin = API_BASE.startsWith('http') ? API_BASE.replace(/\/api$/,'') : location.origin;
  const base = location.pathname.includes('/rotina') ? '/rotina' : '';
  const src = origin + base + '/socket.io/socket.io.js';
  const boot=()=>{ try{
    _socket = io(origin, { path: base + '/socket.io', auth:{ token:authToken,build:APP_BUILD }, transports:['websocket','polling'],reconnection:true,reconnectionDelay:500,reconnectionDelayMax:3000 });
    _socket.on('post:novo',()=>{ if(activeTab==='batalha') toast('Nova publicação no feed. Toque em ↻ Atualizar quando quiser ver.'); });
    _socket.on('post:like',d=>{ if(!d)return; $$(`[data-post="${d.postId}"] [data-like]`).forEach(el=>{ const n=$('b',el); if(n)n.textContent=d.total; }); });
    _socket.on('post:comentario',d=>{ if(!d||d.total==null)return; $$(`[data-post="${d.postId}"] [data-comment]`).forEach(el=>{ const n=$('b',el); if(n)n.textContent=d.total; }); });
    _socket.on('notif:nova',()=>{ const btn=$('#sinoBtn'); if(!btn)return; let b=$('.notif-badge',btn); if(!b){b=document.createElement('span');b.className='notif-badge';btn.appendChild(b);} const n=Math.min(99,(parseInt(b.textContent)||0)+1); b.textContent=n>9?'9+':n; });
    _socket.on('aviso:novo',()=>checarAvisosAdmin());
    // SYNC AO VIVO ponta a ponta: mudou num aparelho → reflete nos outros na hora (sem F5)
    _socket.on('state:changed', (d)=>{ if(!d || d.src===CLIENT_ID) return; applyRemoteState(d.chave, d.valor,d.versao); });
    _socket.on('profile:changed', (d)=>{ if(!d || d.src===CLIENT_ID) return; applyRemoteProfile(d.usuario); });
    // AUTOUPDATE ao vivo: desenvolvedor subiu versão nova → recarrega na hora (HTML é network-first, pega o novo)
    _socket.on('app:update', solicitarAtualizacaoApp);
    _socket.on('dm:nova', (m)=>{
      _socket.emit('dm:delivered',{id:m.id});
      const nome=m.de?.nomeGuerra||'Alguém';
      if(_chatUser && m.de && m.de.username===_chatUser && $('#chatMsgs')){
        $('#chatMsgs').querySelector('.muted')?.remove();
        $('#chatMsgs').insertAdjacentHTML('beforeend',bolhaChat({...m,meu:false,lida:true}));
        $('#chatMsgs').scrollTop=$('#chatMsgs').scrollHeight;
        api('/dm/'+encodeURIComponent(_chatUser)).then(atualizarBadgeDM).catch(()=>{}); limparNotifDM(_chatUser);
      } else {
        toast('💬 '+nome+': '+(m.texto||'Enviou uma mídia').slice(0,40));
        atualizarBadgeDM();
      }
    });
    _socket.on('dm:entregue',d=>{ const x=$(`[data-dm-tick="${d.id}"]`); if(x&&x.dataset.status!=='lida'){x.textContent='✓✓';x.dataset.status='entregue';} });
    _socket.on('dm:lida',()=>{ if(_chatUser) $$('[data-dm-tick]').forEach(x=>{ x.textContent='✓✓'; x.dataset.status='lida'; }); });
    _socket.on('dm:apagada',d=>{ if(!d)return; if(d.modo==='todos')marcarMensagemApagada(d.id);else $(`[data-dm-msg="${d.id}"]`)?.remove(); if(d.tag)try{navigator.serviceWorker?.controller?.postMessage({type:'CLEAR_NOTIFICATION',tag:d.tag});}catch(e){} });
    _socket.on('dm:typing',d=>{ const preview=$(`[data-chat-preview="${d.deId}"]`); if(preview){ if(d.digitando){preview.dataset.anterior=preview.textContent;preview.textContent='digitando…';preview.style.color='var(--ok)';}else if(preview.dataset.anterior){preview.textContent=preview.dataset.anterior;preview.style.color='';delete preview.dataset.anterior;} } if(_chatPeerId&&d.deId===_chatPeerId&&$('#chatTyping')){ $('#chatTyping').textContent=d.digitando?'digitando…':''; const p=$('#chatPresence'); if(p&&d.digitando){p.textContent='digitando…';p.classList.add('live');}else if(p&&_socket)_socket.emit('presence:check',_chatPeerId,x=>{p.classList.toggle('live',!!x.online);p.textContent=x.online?'online':(x.lastSeen?'visto por último '+formatarVisto(x.lastSeen):'offline')}); } });
    _socket.on('presence:update',d=>{ const preview=$(`[data-chat-preview="${d.userId}"]`); if(preview&&d.online&&!preview.dataset.anterior){preview.textContent='online';preview.style.color='var(--ok)';} if(_chatPeerId&&d.userId===_chatPeerId&&$('#chatPresence')){ const p=$('#chatPresence');p.classList.toggle('live',!!d.online);p.textContent=d.online?'online':(d.lastSeen?'visto por último '+formatarVisto(d.lastSeen):'offline'); } });
  }catch(e){} };
  if(window.io){ boot(); return; }
  const s=document.createElement('script'); s.src=src; s.onload=boot; s.onerror=()=>{}; document.head.appendChild(s);
}

function urlB64ToUint8(b64){ const pad='='.repeat((4-b64.length%4)%4); const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(s); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); }
async function subscribePush(){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    if(Notification.permission!=='granted'){ const p=await Notification.requestPermission(); if(p!=='granted') return; }
    const reg=await navigator.serviceWorker.ready;
    const {key}=await api('/push/vapid',{auth:false});
    if(!key) return; // servidor sem VAPID configurado
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64ToUint8(key) });
    await api('/push/subscribe',{method:'POST',body:sub.toJSON()});
  }catch(e){ console.warn('push', e); }
}

/* =========================================================================
   BOOT
========================================================================= */
(async function boot(){
  applyTheme('red');
  if(authToken){
    try{ await enterApp(); }
    catch(e){ setToken(null); $('#auth').classList.remove('hidden'); renderAuth(); }
  } else { $('#auth').classList.remove('hidden'); renderAuth(); }
  // link de reset de senha (#reset=token) — funciona logado ou não
  try{ const h=location.hash||''; if(h.includes('reset=')){ const t=new URLSearchParams(h.slice(1)).get('reset'); if(t) resetarSenhaSheet(t); } }catch(e){}
  // registra service worker (só funciona em https/host real; ignora falha local)
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message',e=>{ if(e.data?.type!=='OPEN_DEEP_LINK'||!e.data.url)return; try{ const u=new URL(e.data.url,location.origin); if(u.origin===location.origin&&u.pathname===location.pathname){location.hash=u.hash;handleDeepLink();}else location.assign(u.href); }catch(_){} });
    // autoupdate: quando uma versão nova assume, recarrega sozinho (sem F5)
    let _reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(_reloaded) return;
      // se o socket 'app:update' já recarregou agora há pouco, NÃO recarrega de novo (evita reload duplo/lentidão)
      try{ if(Date.now()-(+sessionStorage.getItem('rz:reloadAt')||0) < 12000){ return; } }catch(e){}
      _reloaded=true; solicitarAtualizacaoApp();
    });
    // O listener vem antes do registro para não perder controllerchange em conexões rápidas.
    navigator.serviceWorker.register('service-worker.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
    // checa por atualização periodicamente (app aberto por muito tempo)
    // O socket entrega deploy em tempo real; esta checagem é só contingência e não deve gastar dados a cada 5s.
    const checarVersao=()=>{if(document.visibilityState==='visible')navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});};
    setInterval(checarVersao,10000);document.addEventListener('visibilitychange',()=>{checarVersao();if(document.visibilityState==='visible')sincronizarRelogioBrasilia();});
  }
})();
</script>
